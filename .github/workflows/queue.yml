# The queue of the pull requests with auto-merge (reusable-queue.yml, CI.md "The queue"). With strict status checks in
# the ruleset of main, it merges main into each pull request with auto-merge that is behind, and starts the held
# pull_request runs of the new head. With strict off, no pull request is behind, and the job updates no branch.
# Other repositories call mark1russell7/template/.github/workflows/reusable-queue.yml@<commit> # main
name: Queue

on:
  # A merge into main makes the other pull requests behind
  push:
    branches: [main]
  # A pull request can be behind already when it gets auto-merge
  pull_request:
    types: [auto_merge_enabled]
  # A person starts a run by hand from the Actions tab
  workflow_dispatch:

permissions: {}

# One run at a time in the repository. A run in progress ends, and GitHub keeps only the newest run that waits. Each run
# reads all the pull requests, so the newest run does the work of a run that GitHub cancelled.
concurrency:
  group: queue
  cancel-in-progress: false

jobs:
  queue:
    uses: ./.github/workflows/reusable-queue.yml
    permissions:
      contents: write
      pull-requests: write
      actions: write
