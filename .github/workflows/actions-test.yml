# Tests the shared actions (.github/actions) and the shared workflows of the Pages and of the release
# (CI.md) on this repository, with the files of this commit:
#
#   green-main      The action finds a commit.
#   pages           reusable-pages.yml builds a test site with the Releases page and the Status page,
#                   and uploads the Pages artifact, with no deploy.
#   pages-check     The pages and their JSON are in the artifact.
#   release-build   reusable-release-build.yml packs the packages of this repository. Only a run on
#                   main checks that the commit is on main (the input require-main). The input
#                   after-pack tests the tarballs, writes an output, adds a title and the
#                   tarballs to each entry of the plan, and sets "latest" on one entry.
#   release-publish The npm-publish action examines the tarballs with "dry-run": it publishes nothing.
#                   The job has no "id-token: write", so npm cannot accept a publish. A step reads
#                   the output of after-pack.
#   release-tag     reusable-release-tag.yml examines the plan, the tarballs and the tags with "dry-run".
#                   Its log shows the flags of each release: --latest for the entry with "latest",
#                   and --latest=false for the others.
#
# ci.yml tests reusable-ci.yml on each push and pull request. new-repo.ps1 does not copy this
# workflow, the actions or the shared workflows: a repository uses them from GitHub.
name: Actions test

on:
  push:
    branches: [main]
    paths:
      - ".github/actions/**"
      - ".github/workflows/actions-test.yml"
      - ".github/workflows/reusable-pages.yml"
      - ".github/workflows/reusable-release-*.yml"
      - "scripts/release/**"
      # The test site installs the workspace, so a change of a package file can break it
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/*/package.json"
      # The site check of reusable-pages.yml runs from this folder
      - "packages/site-pages/src/check/**"
  # Each pull request starts this workflow, so the check "Actions OK" of the ruleset is always there. The job
  # changes skips the tests when the pull request changes no file of them (CI.md, "A gate with paths").
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels the older run of the same ref, so the runs of old commits free their runners
concurrency:
  group: actions-test-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: changes
        uses: ./.github/actions/changes
        with:
          # The same files as on.push.paths
          paths: |
            .github/actions/**
            .github/workflows/actions-test.yml
            .github/workflows/reusable-pages.yml
            .github/workflows/reusable-release-*.yml
            scripts/release/**
            package.json
            pnpm-lock.yaml
            packages/*/package.json
            packages/site-pages/src/check/**

  green-main:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      # The actions of this commit, not of main: a checkout first, then the local paths
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: green-local
        uses: ./.github/actions/green-main
      - name: green-main gives a commit
        env:
          SHA: ${{ steps.green-local.outputs.sha }}
          STATE: ${{ steps.green-local.outputs.state }}
        run: |
          echo "green-main: $SHA (CI of the newest commit: $STATE)"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]

  pages:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    uses: ./.github/workflows/reusable-pages.yml
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
    with:
      # The env input gets to the build command
      build: |
        test "$TEST_SITE" = actions-test
        mkdir -p test-site
        cat > test-site/index.html <<'HTML'
        <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Test site</title></head><body><p>The test site of actions-test.yml.</p>
        <button id="go">Go</button> <output id="out"></output>
        <script>document.getElementById("go").addEventListener("click", () => { document.getElementById("out").textContent = "done"; });</script>
        </body></html>
        HTML
        # The probe of the site check: the button of the test site writes "done".
        echo 'click("#go"); check("the button writes done", await until(() => $("#out").textContent === "done"));' > test-site-probe.js
      out: test-site
      env: '{"TEST_SITE": "actions-test"}'
      packages: "@mark1russell7/template-cli,@mark1russell7/site-pages"
      roadmap: docs/ROADMAP.md
      # The check of the home and of the two pages of site-pages, with the probe on the home
      site-check: true
      site-check-pages: /,/releases/,/status/
      site-check-probe: test-site-probe.js
      deploy: false

  pages-check:
    needs: pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-check
          path: ${{ runner.temp }}/site-check
      - name: The pages, the data and the screenshots of the site check exist
        env:
          OUT: ${{ runner.temp }}/site
          ARTIFACT: ${{ runner.temp }}/artifact
          CHECK: ${{ runner.temp }}/site-check
        run: |
          mkdir -p "$OUT"
          tar -xf "$ARTIFACT/artifact.tar" -C "$OUT"
          for f in index.html data/releases.json data/status.json releases/index.html status/index.html; do
            test -s "$OUT/$f" || { echo "::error::$f is missing"; exit 1; }
            echo "ok $f ($(wc -c < "$OUT/$f") bytes)"
          done
          node -e 'const r = require(process.argv[1]); const n = r.views.length; if (!r.ok || n !== 18) { console.error("::error::the site check has", n, "views, not 18, or did not pass"); process.exit(1); } const p = r.views.filter((v) => v.probe?.length > 0).length; if (p !== 3) { console.error("::error::the probe ran in", p, "views, not 3"); process.exit(1); } console.log("site check:", n, "views passed, the probe in", p)' "$CHECK/report.json"
          for w in 360 400 1280; do for s in light dark; do for page in home releases status; do
            test -s "$CHECK/$page-$w-$s.png" || { echo "::error::the screenshot $page-$w-$s.png is missing"; exit 1; }
          done; done; done
          node -e 'const s = require(process.argv[1]); if (!s.github?.available) { console.error("::error::the GitHub part is not available:", s.github?.reason); process.exit(1); } if (!(s.items?.length > 0)) { console.error("::error::the Status page has no roadmap item"); process.exit(1); } console.log("github:", s.pullRequests.length, "open PRs,", s.issues.length, "open issues;", s.items.length, "roadmap items")' "$OUT/data/status.json"

  release-build:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    uses: ./.github/workflows/reusable-release-build.yml
    permissions:
      contents: read
    with:
      # The commit of a pull request is not on main yet, and the step "The commit is on main" stops a
      # release for it. Thus that step runs only in a run on main, which also tests it.
      require-main: ${{ github.ref == 'refs/heads/main' }}
      # The test of after-pack: each tarball of packages.txt exists, the output "packages" for
      # release-publish, and the optional fields "title", "tarballs" and "latest" of the plan for
      # release-tag. "latest" goes on the first entry that is not a prerelease.
      after-pack: |
        while read -r name version file; do
          [ -n "$name" ] || continue
          test -s "$RELEASE_DIR/$file"
          echo "ok $name $version $file"
        done < "$RELEASE_DIR/packages.txt"
        jq '[.[] | .title = "\(.name) \(.version)" | .tarballs = [.name]]
          | (map(.prerelease) | index(false)) as $i | if $i == null then . else .[$i].latest = true end' "$TAGS_FILE" > "$RUNNER_TEMP/plan.json"
        mv "$RUNNER_TEMP/plan.json" "$TAGS_FILE"
        echo "packages=$(grep -c . "$RELEASE_DIR/packages.txt")" >> "$GITHUB_OUTPUT"

  release-publish:
    needs: release-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No "id-token: write": npm cannot accept a publish from this job.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: publish
        uses: ./.github/actions/npm-publish
        with:
          dry-run: "true"
      - name: The dry run published nothing
        env:
          PUBLISHED: ${{ steps.publish.outputs.published }}
        run: |
          echo "published: \"$PUBLISHED\""
          [ -z "$PUBLISHED" ]
      - name: The output of after-pack gets to a later job
        env:
          PACKAGES: ${{ fromJSON(needs.release-build.outputs.after-pack).packages }}
        run: |
          echo "after-pack: $PACKAGES packages"
          [ "$PACKAGES" -gt 0 ]

  release-tag:
    needs: [release-build, release-publish]
    uses: ./.github/workflows/reusable-release-tag.yml
    permissions:
      contents: read
    with:
      published: ""
      dry-run: true

  actions-ok:
    name: Actions OK
    if: always()
    needs: [changes, green-main, pages, pages-check, release-build, release-publish, release-tag]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/gate-summary
        with:
          needs: ${{ toJSON(needs) }}
