# Builds the site of the template and publishes it to GitHub Pages at https://mark1russell7.github.io/template/,
# with the shared Pages workflow of this repository (reusable-pages.yml, CI.md "Pages").
# The home page is the Vite build of packages/site: a preview of the files of each preset of the CLI,
# and an explorer of the shared workflows. The site-pages action adds the Releases page and the Status page.
# The Pages source of the repository is "GitHub Actions" (Settings > Pages).
# A scheduled build takes the newest commit of main, or the newest green one if CI failed on it.
# A pull request builds and checks the site in a browser, with no deploy. The job site of actions-test.yml calls this
# workflow on each pull request, so the required check "Actions OK" waits for the probe of the site.
name: Pages

on:
  push:
    branches: [main]
  # After a release, so that the Releases page has the new version
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  # Every 3 hours, so that the Status page shows the open pull requests and issues of now
  schedule:
    - cron: "30 */3 * * *"
  workflow_dispatch:
  # actions-test.yml calls this workflow on each pull request (the job site)
  workflow_call:

permissions: {}

# One deployment at a time. A deployment in progress ends, and GitHub keeps only the newest deployment that waits.
# Each pull request has its own group, and a newer push cancels its run.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pages:
    # The template calls the shared workflow of its own commit, as ci.yml does
    uses: ./.github/workflows/reusable-pages.yml
    # The build job of the shared workflow gets only the read permissions. Only its deploy job,
    # which runs no code of the repository, writes to Pages.
    permissions:
      contents: read
      # green-main reads the Actions runs. site-pages reads the pull requests, the issues and their checks.
      actions: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
      pages: write
      id-token: write
    with:
      # The build starts the CLI for each preset and reads the shared workflows (packages/site/vite.config.ts).
      # site-pages adds releases/ and status/ next to the home page.
      build: pnpm --filter @template/site run build
      out: packages/site/dist
      env: '{"SITE_BASE": "/${{ github.event.repository.name }}"}'
      deploy: ${{ github.event_name != 'pull_request' }}
      packages: "@mark1russell7/conventions,@mark1russell7/site-pages,@mark1russell7/api-report,@mark1russell7/boundaries,@mark1russell7/template-cli"
      site-name: Template
      # The open items for the Status page. check:conventions parses the file on each pull request (roadmap-parses).
      roadmap: docs/ROADMAP.md
      # The check opens each page in a browser at 360, 400 and 1280 pixels, in light and dark.
      # The probe drives the package preview and the workflow explorer. The check reads the TypeScript source
      # and removes its types.
      site-check: true
      site-check-pages: /,/releases/,/status/
      site-check-probe: packages/site/src/check-probe.ts
      # The home page shows one fixed study. The freshness gate reads its stamp (packages/site/src/data-stamps.ts).
      data-stamps: packages/site/dist/data-stamps.json
