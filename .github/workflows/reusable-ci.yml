# The shared CI of the repositories of mark1russell7 (CI.md).
#
# The job installs with pnpm (the version comes from "packageManager" in package.json) and runs
# each script of the "scripts" input that package.json has. It skips each script that package.json
# does not have, so most repositories need no inputs. A script of "recursive-scripts" that the root
# package.json does not have runs in each package of the workspace that has it.
#
# The job runs all the scripts, also after a failure, and then fails with the list of the failed
# scripts. The summary of the run has a table of the scripts.
#
# A repository calls it from its ci.yml:
#
#   jobs:
#     ci:
#       uses: mark1russell7/template/.github/workflows/reusable-ci.yml@<commit> # main
#
# The template itself calls it by the local path, so each pull request of the template tests it.
#
# On a pull request, the job release-check starts the release build on the commit (actions/release-check, CI.md "The
# release check"). It fails when the release build fails on the same commit, for example when a shipped file changes and its
# version is already on npm.
#
# A run that workflow_dispatch starts on a branch has no pull request in its event, for example a run by hand. For
# such a run, the job pull finds the open pull request of the branch (actions/pull-of-run). The jobs changesets and
# release-check then examine its change, and the job checks gives its base and its text to check:conventions.
name: Reusable CI

on:
  workflow_call:
    inputs:
      scripts:
        description: The package.json scripts to run, in this sequence, separated by spaces. A script that package.json does not have is skipped.
        type: string
        default: format:check typecheck lint check:conventions test build check:boundaries check:api lint:ste
      recursive-scripts:
        description: The scripts that run in each package of the workspace (pnpm -r --if-present) when the root package.json does not have them.
        type: string
        default: build
      node-versions:
        description: The Node.js versions of the matrix, as a JSON array.
        type: string
        default: '["26"]'
      os:
        description: The runners of the matrix, as a JSON array.
        type: string
        default: '["ubuntu-latest"]'
      setup:
        description: A bash command after the install and before the scripts, for example the install of a Playwright browser.
        type: string
        default: ""
      run:
        description: A bash command after the scripts, for example "npm pack --dry-run".
        type: string
        default: ""
      env:
        description: Environment variables for the install, the scripts and the commands, as a JSON object.
        type: string
        default: "{}"
      working-directory:
        description: The folder of the package.json, relative to the root of the repository.
        type: string
        default: "."
      cue-version:
        description: >-
          The version of the cue CLI for the scripts, for example "0.15.1". The action setup-cue installs it before the
          install of the dependencies, with retries and a sha256 check. The default "" installs no cue CLI.
        type: string
        default: ""
      fetch-depth:
        description: >-
          The number of commits that the checkout gets. 0 gets the whole history. The default 2 gets the parents of the
          merge commit of a pull request, so the rule release-files of check:conventions sees the change.
        type: number
        default: 2
      timeout-minutes:
        description: The time limit of each job of the matrix. The job coverage has its own limit.
        type: number
        default: 15
      changesets:
        description: >-
          On a pull request, check that each published package that changes has a changeset, and that no changeset
          makes a 0.x package into 1.0.0 (actions/changeset-check). A repository with no .changeset/config.json passes.
          A run that workflow_dispatch starts on the branch of an open pull request examines that pull request.
        type: boolean
        default: true
      changeset-ignore:
        description: More globs of files that need no changeset, separated by spaces.
        type: string
        default: ""
      coverage:
        description: >-
          Start the tests of each package with Vitest again, with coverage (actions/coverage), in the job coverage. That job
          uses the first runner and Node.js version of the matrix, in parallel with the job checks. The summary gets a table
          of each package, and the artifact coverage has the reports. Each package needs @vitest/coverage-v8. A failure
          fails the CI.
        type: boolean
        default: false
      coverage-floor:
        description: The lowest percent of each measure of the coverage of each package. 0 is no floor. Only with coverage.
        type: number
        default: 0
      coverage-on-main:
        description: >-
          With coverage false, a push to the default branch of a public repository still starts the job coverage, not strict: it skips a
          package with no @vitest/coverage-v8, and a failure is a warning. So each repository has the artifact coverage on
          main. This job does not fail the CI, also at its time limit, and the gate of release.yml does not start it.
          false turns it off.
        type: boolean
        default: true
      coverage-timeout-minutes:
        description: >-
          The time limit of the job coverage. The tests stop 2 minutes before it, so the job ends with its summary. The
          summary gives the time of the job, and a time above 80 % of the limit gives a warning.
        type: number
        default: 30
      coverage-scripts:
        description: >-
          The scripts that the job coverage starts before the tests, separated by spaces. The default "" takes each script
          of the input scripts before test whose name is build or starts with build:.
        type: string
        default: ""
      release-check:
        description: >-
          On a pull request, start the release build on the commit (actions/release-check): the install, the build, pack.ts
          and tags.ts. It fails when the release build fails on the same commit, for example a shipped change at a version on npm. A
          repository with no published package passes at once. A run that workflow_dispatch starts on the branch of an
          open pull request also starts it. false turns it off.
        type: boolean
        default: true
      release-check-private:
        description: >-
          The job release-check starts in a private repository only when this input is true. A private repository pays
          for each job start, also for a job that only finds no published package.
        type: boolean
        default: false
      release-build:
        description: The input build of the release.yml of the repository (reusable-release-build.yml), for the job release-check.
        type: string
        default: ""
      release-node-version:
        description: The input node-version of the release.yml of the repository (reusable-release-build.yml), for the job release-check.
        type: string
        default: "26"
      release-window:
        description: >-
          On a pull request that changes .github/workflows or scripts/release, the job release-window fails while a
          release.yml run of the base branch is open (RELEASING.md, "A tag that GitHub refuses"). false turns it off.
        type: boolean
        default: true
      pull-request-private:
        description: >-
          In a private repository, the job pull finds the pull request of a dispatched run only when this input is true.
          The job that calls this workflow then gives "pull-requests: read" (CI.md, "A dispatched run of a pull
          request"). With false, a dispatched run in a private repository examines no change, and a private repository
          pays for no start of the job pull.
        type: boolean
        default: false
    secrets:
      CONVENTIONS_PRIVATE_PATTERNS:
        description: >-
          Private regular expressions, one on each line, of text that no file, commit message of the change or text of
          its pull request has (the rule no-local-paths of check:conventions). The check shows no text of a match. A
          caller gives it with secrets: inherit, or by name.
        required: false

jobs:
  # A run that workflow_dispatch starts has no pull request in its event, for example a run by hand (CI.md "A
  # dispatched run of a pull request"). This job finds the open pull request of the branch, and gives its base, its head,
  # its labels and its text to the other jobs. A failure of this job fails the CI: the other jobs do not pass a change that they cannot read. A run on
  # the default branch, for example the gate of release.yml, has no pull request, so the job does not start. In a private
  # repository, the job starts only with the input pull-request-private, because only then can the token of the job read
  # the pull requests.
  pull:
    if: >-
      github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/')
      && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
      && (!github.event.repository.private || inputs.pull-request-private)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The job has no permissions key, so it gets the permissions of the caller. A job of a called workflow cannot ask for
    # more than the caller gives: "pull-requests: read" here would stop each caller that gives only "contents: read", also
    # when the job does not start. In a public repository, each token can read the pull requests. A private repository
    # gives "pull-requests: read" to the job that calls this workflow, with the input pull-request-private. The job runs
    # only code of the template, and its one write is the artifact pull-request-of-run of this run.
    outputs:
      found: ${{ steps.pull.outputs.found }}
      base-ref: ${{ steps.pull.outputs.base-ref }}
      base-sha: ${{ steps.pull.outputs.base-sha }}
      head-ref: ${{ steps.pull.outputs.head-ref }}
      head-sha: ${{ steps.pull.outputs.head-sha }}
      labels: ${{ steps.pull.outputs.labels }}
    steps:
      # The action comes from the commit of this workflow, as in the job changesets. The job does not check out the
      # repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-actions
          sparse-checkout: .github/actions
          persist-credentials: false
      # The step is TypeScript: Node runs it with its type stripping, not the Node of the runner image
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - id: pull
        uses: ./.shared-actions/.github/actions/pull-of-run
        with:
          file: ${{ runner.temp }}/pull-request-of-run/pull-request.json
      # The job checks reads the title, the body and the number of commits from this file. A file, not an output of the
      # job: a step gets an output of a job through an environment variable, which takes at most 32 767 characters on
      # Windows, and a body can be longer. A run again of the whole workflow uploads the file again (overwrite).
      - name: Save the pull request of the run
        if: steps.pull.outputs.found == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pull-request-of-run
          path: ${{ runner.temp }}/pull-request-of-run/pull-request.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  changesets:
    needs: pull
    # On a run that workflow_dispatch starts, the job examines the pull request of the job pull. A failure of the job pull
    # fails the CI, so this job does not start then.
    if: ${{ !cancelled() && inputs.changesets && (github.event_name == 'pull_request' || needs.pull.outputs.found == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # The whole history, so that git finds the merge base of the pull request
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The action comes from the commit of this workflow, as in reusable-pages.yml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-actions
          sparse-checkout: .github/actions
          persist-credentials: false
      # The check is TypeScript: Node runs it with its type stripping, not the Node of the runner image
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      # On a pull request, the job pull does not start, so its outputs are empty and the event gives the values
      - uses: ./.shared-actions/.github/actions/changeset-check
        with:
          ignore: ${{ inputs.changeset-ignore }}
          base-sha: ${{ needs.pull.outputs.base-sha || github.event.pull_request.base.sha }}
          head-sha: ${{ needs.pull.outputs.head-sha || github.event.pull_request.head.sha }}
          head-ref: ${{ needs.pull.outputs.head-ref || github.event.pull_request.head.ref }}
          labels: ${{ needs.pull.outputs.labels || toJSON(github.event.pull_request.labels.*.name) }}

  # The release predicate on the commit of a pull request (CI.md "The release check"). The repository goes to the folder
  # repo, and the template to .release-template next to it, so the pack of the repository does not see the template.
  release-check:
    needs: pull
    # github.event.repository.private is in each pull_request and workflow_dispatch payload. In a called workflow, github is
    # the context of the caller. On a run that workflow_dispatch starts, the checkout is the head of the pull request.
    if: >-
      ${{ !cancelled() && inputs.release-check && (github.event_name == 'pull_request' || needs.pull.outputs.found == 'true')
      && (!github.event.repository.private || inputs.release-check-private) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The job installs and runs the code of the repository, so it gets only read permissions.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: repo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-template
          sparse-checkout: |
            .github/actions
            scripts/release
          persist-credentials: false
      - uses: ./.release-template/.github/actions/release-check
        with:
          # actions/setup-node refuses a path with "." in it, such as repo/./pnpm-lock.yaml
          working-directory: ${{ (inputs.working-directory == '.' || inputs.working-directory == './' || inputs.working-directory == '') && 'repo' || format('repo/{0}', inputs.working-directory) }}
          build: ${{ inputs.release-build }}
          node-version: ${{ inputs.release-node-version }}

  checks:
    name: checks (${{ matrix.os }}, node ${{ matrix.node }})
    # The job also runs when the job pull is skipped or fails. A failure of the job pull fails the CI anyway.
    needs: pull
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # The job installs and runs the code of the repository, so it gets only read permissions.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # The runners are shared by all repositories of the account (the rule runner-budget)
      max-parallel: 3
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        node: ${{ fromJSON(inputs.node-versions) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch-depth }}
      # The checkout of a pull request of more than one commit ends inside the change. The rule release-files of
      # check:conventions reads each commit of the change, so this step deepens the checkout to the merge base. The rule
      # unreleased-change reads the version at the merge base, which a pull request of one commit also needs when main
      # moved after the start of its branch. On a run that workflow_dispatch starts, the checkout is the head of the
      # branch, not a merge commit. The base is then the tip of the base branch from the job pull, and the step fetches
      # it first. A shallow checkout can give a wrong merge base: an older commit below the true merge base. This occurs
      # when the branch merged an old commit of main. The merge base is correct only when no commit from it to the two
      # tips is a shallow commit (the file shallow of git). The step stops only then. Else it deepens the checkout, and
      # at the end it fetches the whole history. The test scripts/workflows/deepen.test.ts runs this step on a fixture.
      - name: Deepen to the merge base
        if: inputs.fetch-depth != 0 && (github.event.pull_request.commits > 0 || needs.pull.outputs.found == 'true')
        env:
          TOKEN: ${{ github.token }}
          PULL_BASE: ${{ needs.pull.outputs.base-sha }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          if [ -n "$PULL_BASE" ]; then
            base=$PULL_BASE && head=$(git rev-parse HEAD) || exit 1
            git cat-file -e "$base^{commit}" 2> /dev/null || git -c "http.extraheader=$auth" fetch --quiet --no-tags --depth=1 origin "$base"
          else
            base=$(git rev-parse HEAD^1) && head=$(git rev-parse HEAD^2) || exit 0
          fi
          # The function gives 0 when the merge base is correct: the commits from it to the two tips have no shallow
          # commit. Only a condition calls it, so set -e does not apply in it. A pipe from rev-list to grep -q is not
          # safe: with pipefail, rev-list can end on SIGPIPE, and the negated pipe then reads as correct.
          complete() {
            mb=$(git merge-base "$base" "$head") || return 1
            shallow=$(git rev-parse --git-path shallow) || return 1
            [ -s "$shallow" ] || return 0
            span=$(git rev-list "^$mb" "$base" "$head") || return 1
            ! grep -qxF -f "$shallow" <<< "$span"
          }
          for depth in 16 128 1024; do
            complete && exit 0
            git -c "http.extraheader=$auth" fetch --quiet --no-tags --deepen="$depth" origin "$base" "$head"
          done
          complete || git -c "http.extraheader=$auth" fetch --quiet --no-tags --unshallow origin "$base" "$head"
      # On a push to the default branch, the rule unreleased-change of check:conventions compares the commit before the
      # push with HEAD. A push of more commits than the depth of the checkout does not have that commit, so this step
      # fetches it. A failed fetch only makes the rule skip.
      - name: Fetch the commit before the push
        if: >-
          inputs.fetch-depth != 0 && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
          && github.event.before != '0000000000000000000000000000000000000000'
        env:
          TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          git cat-file -e "$BEFORE^{commit}" 2> /dev/null && exit 0
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c "http.extraheader=$auth" fetch --quiet --no-tags --depth=1 origin "$BEFORE" || echo "::notice::The checkout does not have $BEFORE, the commit before the push."
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      # The variables of the input env, and the cue CLI before the install, so that a "prepare" script can use it. The
      # actions come from the commit of this workflow, as in the job changesets. They have no post step, so the last step
      # removes their folder, and the scripts do not see it.
      - if: inputs.cue-version != '' || (inputs.env != '{}' && inputs.env != '')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-actions
          sparse-checkout: .github/actions
          persist-credentials: false
      - if: inputs.env != '{}' && inputs.env != ''
        uses: ./.shared-actions/.github/actions/env-json
        with:
          env: ${{ inputs.env }}
      - if: inputs.cue-version != ''
        uses: ./.shared-actions/.github/actions/setup-cue
        with:
          version: ${{ inputs.cue-version }}
      - if: inputs.cue-version != '' || (inputs.env != '{}' && inputs.env != '')
        working-directory: .
        run: rm -rf .shared-actions
      - run: pnpm install --frozen-lockfile
      - name: Setup command
        if: inputs.setup != ''
        env:
          COMMAND: ${{ inputs.setup }}
        run: eval "$COMMAND"
      # GitHub does not mask each line of a secret of more than one line, so this step masks each private pattern
      - name: Mask the private patterns
        env:
          PATTERNS: ${{ secrets.CONVENTIONS_PRIVATE_PATTERNS }}
        run: |
          while IFS= read -r line; do
            line="${line%$'\r'}"
            [ -n "${line// /}" ] && echo "::add-mask::$line"
          done <<< "$PATTERNS"
          exit 0
      # On a run that workflow_dispatch starts, the event file has no pull request. check:conventions reads the pull
      # request of the job pull from the file that the job saved (CONVENTIONS_PULL_REQUEST): its title, its body and its
      # number of commits. No expression and no environment variable has the text, so its length and its characters do
      # not matter.
      - name: Pull request of the run
        if: needs.pull.outputs.found == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pull-request-of-run
          path: ${{ runner.temp }}/pull-request-of-run
      # CONVENTIONS_BASE and CONVENTIONS_PULL_REQUEST are empty, except on a run of the job pull that found a pull request.
      # The output failed has the names of the failed scripts, separated by spaces.
      - name: Scripts
        id: scripts
        env:
          CONVENTIONS_BASE: ${{ needs.pull.outputs.base-sha }}
          CONVENTIONS_PULL_REQUEST: ${{ needs.pull.outputs.found == 'true' && format('{0}/pull-request-of-run/pull-request.json', runner.temp) || '' }}
          CONVENTIONS_PRIVATE_PATTERNS: ${{ secrets.CONVENTIONS_PRIVATE_PATTERNS }}
          SCRIPTS: ${{ inputs.scripts }}
          RECURSIVE: ${{ inputs.recursive-scripts }}
          CELL: ${{ matrix.os }}, node ${{ matrix.node }}
        run: |
          set +e
          failed=()
          rows=()
          for script in $SCRIPTS; do
            if ! [[ "$script" =~ ^[A-Za-z0-9][A-Za-z0-9:._-]*$ ]]; then
              echo "::error::\"$script\" is not a name of a script."
              exit 1
            fi
            if node -e 'process.exit(require("./package.json").scripts?.[process.argv[1]] ? 0 : 1)' "$script"; then
              command=(pnpm run "$script")
            elif [[ " $RECURSIVE " == *" $script "* ]]; then
              command=(pnpm -r --if-present run "$script")
            else
              echo "package.json has no script \"$script\". The job skips it."
              rows+=("| \`$script\` | skipped |")
              continue
            fi
            echo "::group::${command[*]}"
            "${command[@]}"
            status=$?
            echo "::endgroup::"
            if [ "$status" -eq 0 ]; then
              rows+=("| \`$script\` | passed |")
            else
              echo "::error::${command[*]} failed (exit code $status)."
              rows+=("| \`$script\` | failed |")
              failed+=("$script")
            fi
          done
          {
            echo "### Scripts ($CELL)"
            echo
            echo "| Script | Result |"
            echo "|---|---|"
            printf '%s\n' "${rows[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ ${#failed[@]} -gt 0 ]; then
            echo "failed=${failed[*]}" >> "$GITHUB_OUTPUT"
            echo "::error::These scripts failed: ${failed[*]}"
            exit 1
          fi
      # When check:api fails, this step writes the API reports again, and the next step uploads them as an artifact. A
      # person with no build on their computer can then download the reports and commit them. The log and the summary of
      # check:api show at most 400 lines of a diff, so a large change of an API needs the files. The step starts the script
      # update:api when package.json has it. Else, when check:api is "api-report check" with plain arguments, it starts
      # "api-report update" with the same arguments. The job fails anyway, so a failure of these steps changes nothing.
      - name: API reports of a failed check:api
        id: api-reports
        if: failure() && contains(format(' {0} ', steps.scripts.outputs.failed), ' check:api ')
        continue-on-error: true
        env:
          DEST: ${{ runner.temp }}/api-reports
          ARTIFACT: api-reports-${{ matrix.os }}-node-${{ matrix.node }}
          CELL: ${{ matrix.os }}, node ${{ matrix.node }}
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          check=$(node -p 'require("./package.json").scripts?.["check:api"] ?? ""')
          report=test/api/public-api.txt
          if node -e 'process.exit(require("./package.json").scripts?.["update:api"] ? 0 : 1)'; then
            pnpm run update:api
          elif [[ "$check" =~ ^api-report\ check(\ +[A-Za-z0-9@/._:=-]+)*\ *$ ]]; then
            read -ra args <<< "${check#api-report check}"
            for ((i = 0; i < ${#args[@]}; i++)); do
              case "${args[i]}" in
                --report) report="${args[i + 1]:-$report}" ;;
                --report=*) report="${args[i]#--report=}" ;;
              esac
            done
            pnpm exec api-report update "${args[@]}"
          else
            echo "::notice::The script check:api is not \"api-report check\" with plain arguments, and package.json has no script update:api. The job cannot write the API reports again."
            exit 0
          fi
          # A deleted report is not a file to upload. The count does not use ((count++)), which fails at 0 under set -e
          count=0
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            mkdir -p "$DEST/$(dirname "$file")"
            cp "$file" "$DEST/$file"
            count=$((count + 1))
          done < <(git ls-files -m -o --exclude-standard -- ":(glob)**/$report")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          {
            echo "### API reports ($CELL)"
            echo
            if [ "$count" -eq 0 ]; then
              echo "The update changed no file \`$report\`."
            else
              echo "The job wrote $count API reports again, in the artifact \`$ARTIFACT\`. To commit them, start this command in the folder of \`package.json\`, and examine the diff:"
              echo
              echo '```sh'
              echo "gh run download $RUN_ID -R $REPOSITORY -n $ARTIFACT"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the API reports
        if: failure() && steps.api-reports.outputs.count > 0
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-reports-${{ matrix.os }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/api-reports
          retention-days: 7
          if-no-files-found: error
      - name: Extra command
        if: inputs.run != ''
        env:
          COMMAND: ${{ inputs.run }}
        run: eval "$COMMAND"

  # The tests with coverage, in parallel with the job checks and with a time limit of their own. Thus the coverage does
  # not make the job checks slower, and a slow coverage does not stop it. Not strict (coverage on main), the job does not
  # fail the CI. The gate of release.yml does not start it, so a release does not wait for it.
  coverage:
    if: inputs.coverage || (inputs.coverage-on-main && github.event_name == 'push' && !github.event.repository.private && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && !contains(github.workflow_ref, '/.github/workflows/release.yml@'))
    runs-on: ${{ fromJSON(inputs.os)[0] }}
    timeout-minutes: ${{ inputs.coverage-timeout-minutes }}
    continue-on-error: ${{ !inputs.coverage }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      # Each run step stops at the deadline, 2 minutes before the limit of the job. A job that reaches its limit gets
      # the result "cancelled", also with continue-on-error, and the CI fails. A step that stops at the deadline fails
      # the step, so continue-on-error applies. The job ends with its summary and its artifact.
      - name: Start time
        env:
          LIMIT: ${{ inputs.coverage-timeout-minutes }}
          LEVEL: ${{ inputs.coverage && 'error' || 'warning' }}
        working-directory: .
        run: |
          now=$(date +%s)
          {
            echo "JOB_START=$now"
            echo "COVERAGE_DEADLINE=$((now + LIMIT * 60 - 120))"
            echo "DEADLINE_LEVEL=$LEVEL"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ fromJSON(inputs.node-versions)[0] }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      # As in the job checks: the scripts do not see the folder .shared-actions. The script deadline.ts goes to
      # RUNNER_TEMP, outside the repository. Node.js starts a .ts file from 22.18. With an older Node.js, the steps
      # start with no deadline and a warning: DEADLINE_TS is empty, and ${DEADLINE_TS:+node "$DEADLINE_TS"} gives no word.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-actions
          sparse-checkout: .github/actions
          persist-credentials: false
      - if: inputs.env != '{}' && inputs.env != ''
        uses: ./.shared-actions/.github/actions/env-json
        with:
          env: ${{ inputs.env }}
      - if: inputs.cue-version != ''
        uses: ./.shared-actions/.github/actions/setup-cue
        with:
          version: ${{ inputs.cue-version }}
      - working-directory: .
        run: |
          if node -e 'process.exit(process.features.typescript ? 0 : 1)'; then
            cp .shared-actions/.github/actions/coverage/deadline.ts "$RUNNER_TEMP/deadline.ts"
            echo "DEADLINE_TS=$RUNNER_TEMP/deadline.ts" >> "$GITHUB_ENV"
          else
            echo "::warning::Node.js $(node --version) cannot start a .ts file (Node.js 22.18 or later can). The steps of the job coverage have no deadline. Only the limit of the job stops them."
          fi
          rm -rf .shared-actions
      - name: Install
        env:
          DEADLINE: ${{ env.COVERAGE_DEADLINE }}
        run: |
          ${DEADLINE_TS:+node "$DEADLINE_TS"} pnpm install --frozen-lockfile
      - name: Setup command
        if: inputs.setup != ''
        env:
          COMMAND: ${{ inputs.setup }}
          DEADLINE: ${{ env.COVERAGE_DEADLINE }}
        run: |
          ${DEADLINE_TS:+node "$DEADLINE_TS"} bash -eo pipefail -c "$COMMAND"
      # A test can need the output of a build. Thus the job starts each build script that comes before test in the input
      # scripts, or the scripts of the input coverage-scripts.
      - name: Scripts before the tests
        env:
          SCRIPTS: ${{ inputs.scripts }}
          CHOSEN: ${{ inputs.coverage-scripts }}
          RECURSIVE: ${{ inputs.recursive-scripts }}
          DEADLINE: ${{ env.COVERAGE_DEADLINE }}
        run: |
          list=()
          if [ -n "${CHOSEN// /}" ]; then
            read -ra list <<< "$CHOSEN"
          else
            for script in $SCRIPTS; do
              [ "$script" = test ] && break
              if [ "$script" = build ] || [[ "$script" == build:* ]]; then list+=("$script"); fi
            done
          fi
          for script in "${list[@]}"; do
            if ! [[ "$script" =~ ^[A-Za-z0-9][A-Za-z0-9:._-]*$ ]]; then
              echo "::error::\"$script\" is not a name of a script."
              exit 1
            fi
            if node -e 'process.exit(require("./package.json").scripts?.[process.argv[1]] ? 0 : 1)' "$script"; then
              command=(pnpm run "$script")
            elif [[ " $RECURSIVE " == *" $script "* ]]; then
              command=(pnpm -r --if-present run "$script")
            else
              echo "package.json has no script \"$script\". The job skips it."
              continue
            fi
            echo "::group::${command[*]}"
            ${DEADLINE_TS:+node "$DEADLINE_TS"} "${command[@]}"
            echo "::endgroup::"
          done
      # The action comes from the commit of this workflow, as in the job changesets. The checkout is after the scripts,
      # so the scripts do not see the folder .shared-actions.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-actions
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.shared-actions/.github/actions/coverage
        with:
          floor: ${{ inputs.coverage-floor }}
          strict: ${{ inputs.coverage && 'true' || 'false' }}
          working-directory: ${{ inputs.working-directory }}
          deadline: ${{ env.COVERAGE_DEADLINE }}
      # The time of the job and its limit, for a reader of the run. The daily audit limit-audit.yml reads the warning.
      - name: Time of the job
        if: always()
        working-directory: .
        env:
          LIMIT: ${{ inputs.coverage-timeout-minutes }}
        run: |
          used=$(( $(date +%s) - JOB_START ))
          percent=$(( used * 100 / (LIMIT * 60) ))
          line="The job coverage took $((used / 60)) min $((used % 60)) s of its limit of $LIMIT min ($percent %)."
          printf '\n%s\n' "$line" >> "$GITHUB_STEP_SUMMARY"
          if [ "$percent" -gt 80 ]; then
            echo "::warning::$line Raise the input coverage-timeout-minutes, or make the tests faster."
          else
            echo "$line"
          fi

  # GitHub refuses the tag of a release (HTTP 403) when a workflow file changes between the version merge and the tag job
  # (RELEASING.md, "A tag that GitHub refuses"). Thus a pull request that changes .github/workflows or scripts/release
  # fails at once while a release.yml run of its base branch is open. A red check stops each merge: a person, the
  # release train and the automerge of Renovate. After the release, a new run of the check passes.
  release-window:
    if: github.event_name == 'pull_request' && inputs.release-window
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      # The merge commit and its two parents: the files of the change are the difference to the first parent
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: .github
      - name: No open release
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.base_ref }}
        run: |
          files=$(git diff --no-renames --name-only HEAD^1 HEAD)
          if ! grep -qE '^(\.github/workflows/|scripts/release/)' <<< "$files"; then
            echo "The change has no file of .github/workflows or scripts/release."
            exit 0
          fi
          if [ ! -f .github/workflows/release.yml ]; then
            echo "The repository has no release.yml."
            exit 0
          fi
          if ! open=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch "$BASE" --limit 20 \
            --json databaseId,status,url --jq '[.[] | select(.status != "completed")] | map(.url) | join(" ")'); then
            echo "::warning::The job cannot read the runs of release.yml. A private repository gives the token actions: read."
            exit 0
          fi
          if [ -n "$open" ]; then
            echo "::error::A release.yml run of $BASE is open: $open. This change has a file of .github/workflows or scripts/release, so a merge now makes GitHub refuse the tag of that release (HTTP 403, RELEASING.md). Start this check again after the release."
            exit 1
          fi
          echo "No release.yml run of $BASE is open."
