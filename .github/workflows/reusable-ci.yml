# The shared CI of the repositories of mark1russell7 (CI.md).
#
# The job installs with pnpm (the version comes from "packageManager" in package.json) and runs
# each script of the "scripts" input that package.json has. It skips each script that package.json
# does not have, so most repositories need no inputs. A script of "recursive-scripts" that the root
# package.json does not have runs in each package of the workspace that has it.
#
# The job runs all the scripts, also after a failure, and then fails with the list of the failed
# scripts. The summary of the run has a table of the scripts.
#
# A repository calls it from its ci.yml:
#
#   jobs:
#     ci:
#       uses: mark1russell7/template/.github/workflows/reusable-ci.yml@<commit> # main
#
# The template itself calls it by the local path, so each pull request of the template tests it.
name: Reusable CI

on:
  workflow_call:
    inputs:
      scripts:
        description: The package.json scripts to run, in this sequence, separated by spaces. A script that package.json does not have is skipped.
        type: string
        default: format:check typecheck lint check:conventions test build check:boundaries check:api lint:ste
      recursive-scripts:
        description: The scripts that run in each package of the workspace (pnpm -r --if-present) when the root package.json does not have them.
        type: string
        default: build
      node-versions:
        description: The Node.js versions of the matrix, as a JSON array.
        type: string
        default: '["26"]'
      os:
        description: The runners of the matrix, as a JSON array.
        type: string
        default: '["ubuntu-latest"]'
      setup:
        description: A bash command after the install and before the scripts, for example the install of a Playwright browser.
        type: string
        default: ""
      run:
        description: A bash command after the scripts, for example "npm pack --dry-run".
        type: string
        default: ""
      env:
        description: Environment variables for the install, the scripts and the commands, as a JSON object.
        type: string
        default: "{}"
      working-directory:
        description: The folder of the package.json, relative to the root of the repository.
        type: string
        default: "."
      cue-version:
        description: >-
          The version of the cue CLI for the scripts, for example "0.15.1". The action setup-cue installs it before the
          install of the dependencies, with retries and a sha256 check. The default "" installs no cue CLI.
        type: string
        default: ""
      fetch-depth:
        description: >-
          The number of commits that the checkout gets. 0 gets the whole history. The default 2 gets the parents of the
          merge commit of a pull request, so the rule release-files of check:conventions sees the change.
        type: number
        default: 2
      timeout-minutes:
        description: The time limit of each job of the matrix. The job coverage has its own limit.
        type: number
        default: 15
      changesets:
        description: >-
          On a pull request, check that each published package that changes has a changeset, and that no changeset
          makes a 0.x package into 1.0.0 (actions/changeset-check). A repository with no .changeset/config.json passes.
        type: boolean
        default: true
      changeset-ignore:
        description: More globs of files that need no changeset, separated by spaces.
        type: string
        default: ""
      coverage:
        description: >-
          Start the tests of each package with Vitest again, with coverage (actions/coverage), in the job coverage. That job
          uses the first runner and Node.js version of the matrix, in parallel with the job checks. The summary gets a table
          of each package, and the artifact coverage has the reports. Each package needs @vitest/coverage-v8. A failure
          fails the CI.
        type: boolean
        default: false
      coverage-floor:
        description: The lowest percent of each measure of the coverage of each package. 0 is no floor. Only with coverage.
        type: number
        default: 0
      coverage-on-main:
        description: >-
          With coverage false, a push to the default branch of a public repository still starts the job coverage, not strict: it skips a
          package with no @vitest/coverage-v8, and a failure is a warning. So each repository has the artifact coverage on
          main. This job does not fail the CI, also at its time limit, and the gate of release.yml does not start it.
          false turns it off.
        type: boolean
        default: true
      coverage-timeout-minutes:
        description: >-
          The time limit of the job coverage. The tests stop 2 minutes before it, so the job ends with its summary. The
          summary gives the time of the job, and a time above 80 % of the limit gives a warning.
        type: number
        default: 30
      coverage-scripts:
        description: >-
          The scripts that the job coverage starts before the tests, separated by spaces. The default "" takes each script
          of the input scripts before test whose name is build or starts with build:.
        type: string
        default: ""
      release-window:
        description: >-
          On a pull request that changes .github/workflows or scripts/release, the job release-window fails while a
          release.yml run of the base branch is open (RELEASING.md, "A tag that GitHub refuses"). false turns it off.
        type: boolean
        default: true
    secrets:
      CONVENTIONS_PRIVATE_PATTERNS:
        description: >-
          Private regular expressions, one on each line, of text that no file, commit message of the change or text of
          its pull request has (the rule no-local-paths of check:conventions). The check shows no text of a match. A
          caller gives it with secrets: inherit, or by name.
        required: false

jobs:
  changesets:
    if: github.event_name == 'pull_request' && inputs.changesets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # The whole history, so that git finds the merge base of the pull request
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The action comes from the commit of this workflow, as in reusable-pages.yml
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-actions
          sparse-checkout: .github/actions
          persist-credentials: false
      # The check is TypeScript: Node runs it with its type stripping, not the Node of the runner image
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
      - uses: ./.shared-actions/.github/actions/changeset-check
        with:
          ignore: ${{ inputs.changeset-ignore }}

  checks:
    name: checks (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # The job installs and runs the code of the repository, so it gets only read permissions.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # The runners are shared by all repositories of the account (the rule runner-budget)
      max-parallel: 3
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        node: ${{ fromJSON(inputs.node-versions) }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch-depth }}
      # The checkout of a pull request of more than one commit ends inside the change. The rule release-files of
      # check:conventions reads each commit of the change, so this step deepens the checkout to the merge base. The rule
      # unreleased-change reads the version at the merge base, which a pull request of one commit also needs when main
      # moved after the start of its branch. When the checkout has the merge base, the step ends at once.
      - name: Deepen to the merge base
        if: inputs.fetch-depth != 0 && github.event.pull_request.commits > 0
        env:
          TOKEN: ${{ github.token }}
        run: |
          base=$(git rev-parse HEAD^1) && head=$(git rev-parse HEAD^2) || exit 0
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          for depth in 16 128 1024; do
            git merge-base "$base" "$head" > /dev/null && exit 0
            git -c "http.extraheader=$auth" fetch --quiet --no-tags --deepen="$depth" origin "$base" "$head"
          done
          git merge-base "$base" "$head" > /dev/null || git -c "http.extraheader=$auth" fetch --quiet --no-tags --unshallow origin "$base" "$head"
      # On a push to the default branch, the rule unreleased-change of check:conventions compares the commit before the
      # push with HEAD. A push of more commits than the depth of the checkout does not have that commit, so this step
      # fetches it. A failed fetch only makes the rule skip.
      - name: Fetch the commit before the push
        if: >-
          inputs.fetch-depth != 0 && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
          && github.event.before != '0000000000000000000000000000000000000000'
        env:
          TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          git cat-file -e "$BEFORE^{commit}" 2> /dev/null && exit 0
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c "http.extraheader=$auth" fetch --quiet --no-tags --depth=1 origin "$BEFORE" || echo "::notice::The checkout does not have $BEFORE, the commit before the push."
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      # The variables of the input env, and the cue CLI before the install, so that a "prepare" script can use it. The
      # actions come from the commit of this workflow, as in the job changesets. They have no post step, so the last step
      # removes their folder, and the scripts do not see it.
      - if: inputs.cue-version != '' || (inputs.env != '{}' && inputs.env != '')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-actions
          sparse-checkout: .github/actions
          persist-credentials: false
      - if: inputs.env != '{}' && inputs.env != ''
        uses: ./.shared-actions/.github/actions/env-json
        with:
          env: ${{ inputs.env }}
      - if: inputs.cue-version != ''
        uses: ./.shared-actions/.github/actions/setup-cue
        with:
          version: ${{ inputs.cue-version }}
      - if: inputs.cue-version != '' || (inputs.env != '{}' && inputs.env != '')
        working-directory: .
        run: rm -rf .shared-actions
      - run: pnpm install --frozen-lockfile
      - name: Setup command
        if: inputs.setup != ''
        env:
          COMMAND: ${{ inputs.setup }}
        run: eval "$COMMAND"
      # GitHub does not mask each line of a secret of more than one line, so this step masks each private pattern
      - name: Mask the private patterns
        env:
          PATTERNS: ${{ secrets.CONVENTIONS_PRIVATE_PATTERNS }}
        run: |
          while IFS= read -r line; do
            line="${line%$'\r'}"
            [ -n "${line// /}" ] && echo "::add-mask::$line"
          done <<< "$PATTERNS"
          exit 0
      - name: Scripts
        env:
          CONVENTIONS_PRIVATE_PATTERNS: ${{ secrets.CONVENTIONS_PRIVATE_PATTERNS }}
          SCRIPTS: ${{ inputs.scripts }}
          RECURSIVE: ${{ inputs.recursive-scripts }}
          CELL: ${{ matrix.os }}, node ${{ matrix.node }}
        run: |
          set +e
          failed=()
          rows=()
          for script in $SCRIPTS; do
            if ! [[ "$script" =~ ^[A-Za-z0-9][A-Za-z0-9:._-]*$ ]]; then
              echo "::error::\"$script\" is not a name of a script."
              exit 1
            fi
            if node -e 'process.exit(require("./package.json").scripts?.[process.argv[1]] ? 0 : 1)' "$script"; then
              command=(pnpm run "$script")
            elif [[ " $RECURSIVE " == *" $script "* ]]; then
              command=(pnpm -r --if-present run "$script")
            else
              echo "package.json has no script \"$script\". The job skips it."
              rows+=("| \`$script\` | skipped |")
              continue
            fi
            echo "::group::${command[*]}"
            "${command[@]}"
            status=$?
            echo "::endgroup::"
            if [ "$status" -eq 0 ]; then
              rows+=("| \`$script\` | passed |")
            else
              echo "::error::${command[*]} failed (exit code $status)."
              rows+=("| \`$script\` | failed |")
              failed+=("$script")
            fi
          done
          {
            echo "### Scripts ($CELL)"
            echo
            echo "| Script | Result |"
            echo "|---|---|"
            printf '%s\n' "${rows[@]}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::These scripts failed: ${failed[*]}"
            exit 1
          fi
      - name: Extra command
        if: inputs.run != ''
        env:
          COMMAND: ${{ inputs.run }}
        run: eval "$COMMAND"

  # The tests with coverage, in parallel with the job checks and with a time limit of their own. Thus the coverage does
  # not make the job checks slower, and a slow coverage does not stop it. Not strict (coverage on main), the job does not
  # fail the CI. The gate of release.yml does not start it, so a release does not wait for it.
  coverage:
    if: inputs.coverage || (inputs.coverage-on-main && github.event_name == 'push' && !github.event.repository.private && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && !contains(github.workflow_ref, '/.github/workflows/release.yml@'))
    runs-on: ${{ fromJSON(inputs.os)[0] }}
    timeout-minutes: ${{ inputs.coverage-timeout-minutes }}
    continue-on-error: ${{ !inputs.coverage }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      # Each run step stops at the deadline, 2 minutes before the limit of the job. A job that reaches its limit gets
      # the result "cancelled", also with continue-on-error, and the CI fails. A step that stops at the deadline fails
      # the step, so continue-on-error applies. The job ends with its summary and its artifact.
      - name: Start time
        env:
          LIMIT: ${{ inputs.coverage-timeout-minutes }}
          LEVEL: ${{ inputs.coverage && 'error' || 'warning' }}
        working-directory: .
        run: |
          now=$(date +%s)
          {
            echo "JOB_START=$now"
            echo "COVERAGE_DEADLINE=$((now + LIMIT * 60 - 120))"
            echo "DEADLINE_LEVEL=$LEVEL"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ fromJSON(inputs.node-versions)[0] }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      # As in the job checks: the scripts do not see the folder .shared-actions. The script deadline.ts goes to
      # RUNNER_TEMP, outside the repository. Node.js starts a .ts file from 22.18. With an older Node.js, the steps
      # start with no deadline and a warning: DEADLINE_TS is empty, and ${DEADLINE_TS:+node "$DEADLINE_TS"} gives no word.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-actions
          sparse-checkout: .github/actions
          persist-credentials: false
      - if: inputs.env != '{}' && inputs.env != ''
        uses: ./.shared-actions/.github/actions/env-json
        with:
          env: ${{ inputs.env }}
      - if: inputs.cue-version != ''
        uses: ./.shared-actions/.github/actions/setup-cue
        with:
          version: ${{ inputs.cue-version }}
      - working-directory: .
        run: |
          if node -e 'process.exit(process.features.typescript ? 0 : 1)'; then
            cp .shared-actions/.github/actions/coverage/deadline.ts "$RUNNER_TEMP/deadline.ts"
            echo "DEADLINE_TS=$RUNNER_TEMP/deadline.ts" >> "$GITHUB_ENV"
          else
            echo "::warning::Node.js $(node --version) cannot start a .ts file (Node.js 22.18 or later can). The steps of the job coverage have no deadline. Only the limit of the job stops them."
          fi
          rm -rf .shared-actions
      - name: Install
        env:
          DEADLINE: ${{ env.COVERAGE_DEADLINE }}
        run: |
          ${DEADLINE_TS:+node "$DEADLINE_TS"} pnpm install --frozen-lockfile
      - name: Setup command
        if: inputs.setup != ''
        env:
          COMMAND: ${{ inputs.setup }}
          DEADLINE: ${{ env.COVERAGE_DEADLINE }}
        run: |
          ${DEADLINE_TS:+node "$DEADLINE_TS"} bash -eo pipefail -c "$COMMAND"
      # A test can need the output of a build. Thus the job starts each build script that comes before test in the input
      # scripts, or the scripts of the input coverage-scripts.
      - name: Scripts before the tests
        env:
          SCRIPTS: ${{ inputs.scripts }}
          CHOSEN: ${{ inputs.coverage-scripts }}
          RECURSIVE: ${{ inputs.recursive-scripts }}
          DEADLINE: ${{ env.COVERAGE_DEADLINE }}
        run: |
          list=()
          if [ -n "${CHOSEN// /}" ]; then
            read -ra list <<< "$CHOSEN"
          else
            for script in $SCRIPTS; do
              [ "$script" = test ] && break
              if [ "$script" = build ] || [[ "$script" == build:* ]]; then list+=("$script"); fi
            done
          fi
          for script in "${list[@]}"; do
            if ! [[ "$script" =~ ^[A-Za-z0-9][A-Za-z0-9:._-]*$ ]]; then
              echo "::error::\"$script\" is not a name of a script."
              exit 1
            fi
            if node -e 'process.exit(require("./package.json").scripts?.[process.argv[1]] ? 0 : 1)' "$script"; then
              command=(pnpm run "$script")
            elif [[ " $RECURSIVE " == *" $script "* ]]; then
              command=(pnpm -r --if-present run "$script")
            else
              echo "package.json has no script \"$script\". The job skips it."
              continue
            fi
            echo "::group::${command[*]}"
            ${DEADLINE_TS:+node "$DEADLINE_TS"} "${command[@]}"
            echo "::endgroup::"
          done
      # The action comes from the commit of this workflow, as in the job changesets. The checkout is after the scripts,
      # so the scripts do not see the folder .shared-actions.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-actions
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.shared-actions/.github/actions/coverage
        with:
          floor: ${{ inputs.coverage-floor }}
          strict: ${{ inputs.coverage && 'true' || 'false' }}
          working-directory: ${{ inputs.working-directory }}
          deadline: ${{ env.COVERAGE_DEADLINE }}
      # The time of the job and its limit, for a reader of the run. The weekly audit of the main runs reads the same time.
      - name: Time of the job
        if: always()
        working-directory: .
        env:
          LIMIT: ${{ inputs.coverage-timeout-minutes }}
        run: |
          used=$(( $(date +%s) - JOB_START ))
          percent=$(( used * 100 / (LIMIT * 60) ))
          line="The job coverage took $((used / 60)) min $((used % 60)) s of its limit of $LIMIT min ($percent %)."
          printf '\n%s\n' "$line" >> "$GITHUB_STEP_SUMMARY"
          if [ "$percent" -gt 80 ]; then
            echo "::warning::$line Raise the input coverage-timeout-minutes, or make the tests faster."
          else
            echo "$line"
          fi

  # GitHub refuses the tag of a release (HTTP 403) when a workflow file changes between the version merge and the tag job
  # (RELEASING.md, "A tag that GitHub refuses"). Thus a pull request that changes .github/workflows or scripts/release
  # fails at once while a release.yml run of its base branch is open. A red check stops each merge: a person, the
  # release train and the automerge of Renovate. After the release, a new run of the check passes.
  release-window:
    if: github.event_name == 'pull_request' && inputs.release-window
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      # The merge commit and its two parents: the files of the change are the difference to the first parent
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: .github
      - name: No open release
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.base_ref }}
        run: |
          files=$(git diff --no-renames --name-only HEAD^1 HEAD)
          if ! grep -qE '^(\.github/workflows/|scripts/release/)' <<< "$files"; then
            echo "The change has no file of .github/workflows or scripts/release."
            exit 0
          fi
          if [ ! -f .github/workflows/release.yml ]; then
            echo "The repository has no release.yml."
            exit 0
          fi
          if ! open=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --branch "$BASE" --limit 20 \
            --json databaseId,status,url --jq '[.[] | select(.status != "completed")] | map(.url) | join(" ")'); then
            echo "::warning::The job cannot read the runs of release.yml. A private repository gives the token actions: read."
            exit 0
          fi
          if [ -n "$open" ]; then
            echo "::error::A release.yml run of $BASE is open: $open. This change has a file of .github/workflows or scripts/release, so a merge now makes GitHub refuse the tag of that release (HTTP 403, RELEASING.md). Start this check again after the release."
            exit 1
          fi
          echo "No release.yml run of $BASE is open."
