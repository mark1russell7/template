# The security scans of this repository (reusable-security.yml, CI.md): dependency review,
# osv-scanner and CodeQL. A pull request fails only for a new finding at or above high.
# Other repositories call mark1russell7/template/.github/workflows/reusable-security.yml@<commit> # main
name: Security

on:
  pull_request:
  push:
    branches: [main]
  # A weekly scan finds the new advisories for the dependencies that do not change
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: ./.github/workflows/reusable-security.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  # The one check of this file that the ruleset of main names, next to CI OK (CI.md, "The check of the
  # ruleset"). The scans stay out of ci.yml, because release.yml calls ci.yml with contents: read only.
  security-ok:
    name: Security OK
    if: always()
    needs: [security]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Each scan passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
