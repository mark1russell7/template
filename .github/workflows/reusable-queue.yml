# The queue of the pull requests with auto-merge (CI.md, "The queue").
#
# Several writers merge into one main with gh pr merge --auto. With strict status checks in the ruleset of main, GitHub
# merges a pull request only when its branch has the newest main and the required checks passed on that head. This job
# keeps each such pull request up to date. It merges main into each pull request with auto-merge whose merge state is
# BEHIND (update-branch). A push with GITHUB_TOKEN makes the pull_request runs of the new head, but GitHub holds each one
# (the conclusion action_required). The job starts each held run with approve, or with rerun when approve refuses.
#
# The job starts only a held run of the repository itself, on the head of a queued pull request, whose actor is the bot
# of GITHUB_TOKEN. It also starts such runs on the head of each other queued pull request, so a run that came late starts
# at the next run of the queue. A held run that the job cannot start fails the job, with the id of the run.
#
# With strict off, no pull request is BEHIND, and the job updates no branch. The logic is in scripts/workflows/queue.ts of
# the template commit of this workflow. The job does no checkout of the repository and starts none of its code. In a
# private repository, the job starts only when the input private is true, because a private repository pays for each job.
#
# A repository calls it from its queue.yml:
#
#   jobs:
#     queue:
#       uses: mark1russell7/template/.github/workflows/reusable-queue.yml@<commit> # main
#       permissions:
#         contents: write
#         pull-requests: write
#         actions: write
name: Reusable queue

on:
  workflow_call:
    inputs:
      wait-seconds:
        description: >-
          The longest time in seconds (0 to 300) that the job waits for the new heads of the updated pull requests and for
          their pull_request runs. The job reads the runs of a head until the set is stable.
        type: number
        default: 90
      private:
        description: >-
          The job starts in a private repository only when this input is true. A private repository pays for each job start,
          and the job starts on each push to main and on each auto-merge, also when no pull request is behind.
        type: boolean
        default: false

permissions: {}

jobs:
  queue:
    name: Queue
    # A pull request from a fork gets a token that cannot write, and the queue takes no pull request from a fork.
    # github.event.repository.private is in each push, pull_request and workflow_dispatch payload. In a called workflow,
    # github is the context of the caller.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (!github.event.repository.private || inputs.private)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents and pull-requests: update-branch. actions: the read of the workflow runs, approve and rerun.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # The script comes from the commit of this workflow, as the actions of reusable-ci.yml do
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .queue-template
          sparse-checkout: scripts/workflows
          persist-credentials: false
      # The script is TypeScript: Node 24 runs it with its type stripping
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # The script imports the escapes of Markdown and of workflow commands from @mark1russell7/text, at the version that
      # pnpm-lock.yaml of the template gives (CI.md, "The packages of the workflow scripts"). The sparse checkout also has
      # the root package.json of the template, so the install goes to the folder of the script, which has no package.json.
      # Node finds that node_modules first. No install script starts.
      - name: Install the package of the script
        shell: bash
        run: |
          version="$(node .queue-template/scripts/workflows/locked-version.ts .queue-template/pnpm-lock.yaml @mark1russell7/text)"
          npm install --no-save --no-package-lock --ignore-scripts --prefix .queue-template/scripts/workflows "@mark1russell7/text@${version}"
      - name: Update each pull request that is behind, and start its held runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
          WAIT_SECONDS: ${{ inputs.wait-seconds }}
        run: node .queue-template/scripts/workflows/queue.ts
