# The queue of the pull requests with auto-merge (CI.md, "The queue").
#
# Several writers merge into one main with gh pr merge --auto. With strict status checks in the ruleset of main, GitHub
# merges a pull request only when its branch has the newest main and the required checks passed on that head. This job
# keeps each such pull request up to date. It merges main into each pull request with auto-merge whose merge state is
# BEHIND (update-branch), and then starts the workflows of the required checks on the new head with workflow_dispatch.
# An update with GITHUB_TOKEN starts no pull_request run, but GITHUB_TOKEN can start workflow_dispatch.
#
# A summary check such as "CI OK" gets its check run only when the jobs that it needs end. When a required check has no
# check run on the old head, the job reads the workflows that are still in progress on that head, and starts each one that
# has a job of that name.
#
# With strict off, no pull request is BEHIND, and the job changes nothing. The logic is in scripts/workflows/queue.ts of
# the template commit of this workflow. The job does no checkout of the repository and starts none of its code. In a
# private repository, the job starts only when the input private is true, because a private repository pays for each job.
#
# A repository calls it from its queue.yml:
#
#   jobs:
#     queue:
#       uses: mark1russell7/template/.github/workflows/reusable-queue.yml@<commit> # main
#       permissions:
#         contents: write
#         pull-requests: write
#         actions: write
#         checks: read
name: Reusable queue

on:
  workflow_call:
    inputs:
      wait-seconds:
        description: >-
          The longest time in seconds (0 to 300) that the job waits for the new heads of the updated pull requests. The
          job starts the workflows of a pull request only after its head changed.
        type: number
        default: 90
      private:
        description: >-
          The job starts in a private repository only when this input is true. A private repository pays for each job start,
          and the job starts on each push to main and on each auto-merge, also when no pull request is behind.
        type: boolean
        default: false

permissions: {}

env:
  # The version of @mark1russell7/text that the script imports. It is the version that pnpm-lock.yaml of the template
  # resolves, and a test of scripts/workflows/queue.test.ts fails when the two differ.
  TEXT_VERSION: "0.0.6"

jobs:
  queue:
    name: Queue
    # A pull request from a fork gets a token that cannot write, and the queue takes no pull request from a fork.
    # github.event.repository.private is in each push, pull_request and workflow_dispatch payload. In a called workflow,
    # github is the context of the caller.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && (!github.event.repository.private || inputs.private)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # contents and pull-requests: update-branch. actions: workflow_dispatch and the workflow runs. checks: the check runs.
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
    steps:
      # The script comes from the commit of this workflow, as the actions of reusable-ci.yml do
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .queue-template
          sparse-checkout: scripts/workflows
          persist-credentials: false
      # The script is TypeScript: Node 24 runs it with its type stripping
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # The script imports the escapes of Markdown and of workflow commands from @mark1russell7/text. The sparse checkout
      # also has the root package.json of the template, so the install goes to the folder of the script, which has no
      # package.json. Node finds that node_modules first. No install script starts.
      - name: Install the package of the script
        shell: bash
        run: npm install --no-save --no-package-lock --ignore-scripts --prefix .queue-template/scripts/workflows "@mark1russell7/text@${TEXT_VERSION}"
      - name: Update each pull request that is behind, and start its gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
          WAIT_SECONDS: ${{ inputs.wait-seconds }}
        run: node .queue-template/scripts/workflows/queue.ts
