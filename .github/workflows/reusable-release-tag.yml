# The tag job of the standard npm release (RELEASING.md, CI.md). The release.yml of a repository
# calls it after its publish job:
#
#   tag:
#     needs: [build, publish]
#     if: ${{ !cancelled() && needs.build.result == 'success' }}
#     uses: mark1russell7/template/.github/workflows/reusable-release-tag.yml@<commit> # main
#     permissions:
#       contents: write
#     with:
#       published: ${{ needs.publish.outputs.published }}
#
# The job makes a git tag and a GitHub release for each version that the publish job published. It
# runs no code of the repository: gh creates each tag on GitHub, from the data of the plan
# (the artifact "tags" of reusable-release-build.yml).
#
# The job has no "permissions" key: it gets the permissions of the caller job. The release.yml of a
# repository gives it "contents: write", and only this job of the release holds that permission.
#
# Each entry of the plan (tags.json) has name, version, tag, prerelease and notes. Two fields are
# optional. The tags.mjs of the template does not write them, but the tags.mjs of a repository or
# the input after-pack of reusable-release-build.yml can add them:
#   title     The title of the GitHub release. The default is the tag.
#   tarballs  An array of package names. The release gets the tarball of each one as a file, from
#             the artifact "release" (packages.txt names the file).
name: Reusable release tag

on:
  workflow_call:
    inputs:
      published:
        description: The versions that the publish job published, "name@version" with a space between them.
        type: string
        default: ""
      dry-run:
        description: "true: examine the plan and the tags, but make no tag and no release (the test of actions-test.yml)."
        type: boolean
        default: false

jobs:
  tag:
    name: Git tag and GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tags
          path: tags
      # Only a plan with "tarballs" needs the artifact "release" of the build job.
      - name: The plan attaches tarballs
        id: plan
        shell: bash
        run: |
          tarballs=$(jq 'any(.[]; (.tarballs // []) | length > 0)' tags/tags.json)
          echo "tarballs=$tarballs" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.tarballs == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      # tags.json comes from the build job: the name, version, tag, prerelease flag and release text
      # of each published package. This step gives that data to gh and jq only as arguments and files.
      # The commit of a tag never comes from that data:
      #   - A version that this run published gets the commit of this run.
      #   - A different version gets a tag only when npm has it with a provenance statement of this
      #     repository (the repository ID), for example after a run that stopped before its tags.
      #     The tag goes on the commit that the statement names: the commit that the version came from.
      #   - A version without such a statement (a publish by hand) gets no tag.
      # A tag that exists is skipped, so a second run does no harm. gh creates the tag on GitHub.
      #
      # GitHub refuses (HTTP 403) a tag from the workflow token on a commit whose workflow files differ
      # from the workflow files of each branch: that token cannot change workflows. Thus an old commit
      # gets no tag after a change of a workflow, for example after a repository changes its release.yml.
      # For a version of this run, the job then fails. For a different version, it gives a warning.
      # Each time, the summary of the run has the gh command that makes the release with the token of
      # the owner.
      - name: Tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ${{ inputs.published }}
          DRY_RUN: ${{ inputs.dry-run }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -o pipefail
          # The commit of the npm provenance statement of a version, when this repository published it
          provenance_commit() {
            local status
            status=$(curl -sS -o attestations.json -w '%{http_code}' "https://registry.npmjs.org/-/npm/v1/attestations/${1//\//%2f}@$2") || return 1
            [ "$status" = 404 ] && return 0
            if [ "$status" != 200 ]; then
              echo "The registry gave HTTP $status for the attestations of $1@$2." >&2
              return 1
            fi
            jq -r 'first(.attestations[]? | select(.predicateType == "https://slsa.dev/provenance/v1") | .bundle.dsseEnvelope.payload) // empty' attestations.json |
              base64 -d |
              jq -r --arg id "$REPOSITORY_ID" '.predicate.buildDefinition | select(.internalParameters.github.repository_id == $id) | .resolvedDependencies[0].digest.gitCommit // empty'
          }
          plan=tags/tags.json
          count=$(jq length "$plan")
          failed=0
          for ((i = 0; i < count; i++)); do
            name=$(jq -r ".[$i].name" "$plan")
            version=$(jq -r ".[$i].version" "$plan")
            tag=$(jq -r ".[$i].tag" "$plan")
            prerelease=$(jq -r ".[$i].prerelease" "$plan")
            title=$(jq -r ".[$i].title // .[$i].tag" "$plan")
            jq -r ".[$i].notes" "$plan" > notes.md
            # Only the characters of an npm name and a version, and no hyphen at the start (a flag of gh)
            if ! [[ "$tag" =~ ^[A-Za-z0-9@][A-Za-z0-9@._/+-]*$ ]]; then
              echo "::error::The tag \"$tag\" of $name has a character that is not correct."
              exit 1
            fi
            if [ -z "$title" ] || [[ "$title" == *$'\n'* ]]; then
              echo "::error::The title of $tag must be one line of text."
              exit 1
            fi
            # The files of the release: the tarball of each package in "tarballs". packages.txt of the
            # artifact "release" has the lines "name version file".
            if ! jq -e ".[$i].tarballs // [] | type == \"array\" and all(type == \"string\")" "$plan" > /dev/null; then
              echo "::error::\"tarballs\" of $tag must be an array of package names."
              exit 1
            fi
            files=()
            while IFS= read -r package; do
              file=$(awk -v name="$package" '$1 == name { print $3 }' release/packages.txt)
              if ! [[ "$file" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.tgz$ ]] || [ ! -f "release/$file" ]; then
                echo "::error::The artifact \"release\" has no tarball of \"$package\" for $tag."
                exit 1
              fi
              files+=("release/$file")
            done < <(jq -r ".[$i].tarballs // [] | .[]" "$plan")
            if response=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>&1); then
              echo "The tag $tag exists."
              continue
            elif ! grep -q "HTTP 404" <<<"$response"; then
              echo "::error::GitHub gave an error for the tag $tag: $response"
              exit 1
            fi
            case " $PUBLISHED " in
              *" $name@$version "*)
                target=$GITHUB_SHA
                ours=true
                ;;
              *)
                if ! target=$(provenance_commit "$name" "$version"); then
                  echo "::error::The provenance statement of $name $version is not available."
                  exit 1
                fi
                if [ -z "$target" ]; then
                  echo "$name $version: this run did not publish it, and npm has no provenance statement of this repository for it. It gets no tag."
                  continue
                fi
                echo "$name $version: npm has it from the commit $target of this repository, and it has no tag."
                ours=false
                ;;
            esac
            if ! [[ "$target" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::The commit \"$target\" of $tag is not a full SHA."
              exit 1
            fi
            flags=()
            if [ "$prerelease" = true ]; then flags=(--prerelease --latest=false); fi
            if [ "$DRY_RUN" = true ]; then
              echo "Dry run: gh release create $tag ${files[*]} --target $target --title \"$title\" ${flags[*]}"
              continue
            fi
            if output=$(gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$target" --title "$title" --notes-file notes.md "${flags[@]}" 2>&1); then
              echo "$output"
              continue
            fi
            if ! grep -q "HTTP 403" <<<"$output"; then
              echo "::error::gh did not make the release $tag: $output"
              exit 1
            fi
            # The workflow token cannot tag this commit. The summary gives the command for the owner.
            message="GitHub refused the tag $tag on $target (HTTP 403): the workflow files of that commit differ from those of each branch. The summary of the run has the command for the owner."
            if [ "$ours" = true ]; then
              echo "::error::$message"
              failed=1
            else
              echo "::warning::$message"
            fi
            printf -v quoted_title '%q' "$title"
            {
              echo "### GitHub refused the tag \`$tag\`"
              echo
              echo "The workflow token cannot tag $target. Start this command with your own token:"
              if [ ${#files[@]} -gt 0 ]; then
                echo
                echo "First download the tarballs: \`gh run download $GITHUB_RUN_ID --repo $GITHUB_REPOSITORY --name release --dir release\`"
              fi
              echo
              echo '~~~~sh'
              echo "gh release create '$tag'${files[*]:+ ${files[*]}} --repo $GITHUB_REPOSITORY --target $target --title $quoted_title${flags[*]:+ ${flags[*]}} --notes-file - <<'NOTES'"
              cat notes.md
              echo 'NOTES'
              echo '~~~~'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$failed"
