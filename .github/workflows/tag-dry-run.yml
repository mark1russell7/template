# TEMPORARY: a run of the tag step of release.yml on the pull request, for the HTTP 403 case. Removed before the merge.
# Each tag that it can make is a correct tag: the provenance commit, or the commit of the release.
name: Tag step test

on:
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: mkdir tags && node scripts/release/tags.mjs tags/tags.json
      - run: yq '.jobs.tag.steps[1].run' .github/workflows/release.yml > tag.sh
      - name: The provenance path gets HTTP 403 for site-pages (a warning, exit 0)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: ""
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          bash -eo pipefail tag.sh
          cat "$GITHUB_STEP_SUMMARY"
      - name: A version of this run gets HTTP 403 (an error, exit 1)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED: "@mark1russell7/site-pages@0.1.3"
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          GITHUB_SHA=fc25647d49530d09235cac996a11ff9cf29348ae bash -eo pipefail tag.sh && exit 1 || echo "The step failed, as expected."
