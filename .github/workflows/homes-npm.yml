# The map of homes against npm: scripts/homes/npm-drift.ts --check asks npm for each package name of the map
# (packages/conventions/src/map.ts). A package of a published home that is not on npm, a pending name that is on npm,
# a package of an unpublished home that is on npm, and a name that npm does not answer fail the run: a no read is
# never a pass. A planned home that names no package shows as a no read in the summary. The run needs no install:
# the script imports only the map, and Node.js runs TypeScript. It runs each day, on each change of the map on main,
# on each pull request, and by hand. On a pull request it also reads the map of the base commit (--base), and fails
# only on a difference that the base does not have: a package that goes to npm after the base commit is not a fault
# of the pull request. The run on main fails on it, and the owner of the map moves the name out of pending. The job
# exports compares the index of the exports of the homes with npm, each day and by hand.
name: Homes npm

on:
  workflow_dispatch:
  # Each day, so a home that goes to npm leaves the planned state in a day at most
  schedule:
    - cron: "45 6 * * *"
  push:
    branches: [main]
    paths:
      - packages/conventions/src/map.ts
      - scripts/homes/npm-drift.ts
      - .github/workflows/homes-npm.yml
      - packages/conventions/src/home-exports.ts
      - scripts/homes/exports.ts
  # Each pull request, so the ruleset can ask for the check. The run needs no install and takes seconds.
  pull_request:

permissions: {}

concurrency:
  # A newer push cancels only a run of a pull request. A run of main finishes, so each commit of main gets a result.
  group: homes-npm-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  drift:
    name: The map of homes against npm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            packages/conventions/src
            scripts/homes
      - name: The map of the base commit
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 --no-tags origin "$BASE_SHA"
          git show "$BASE_SHA:packages/conventions/src/map.ts" > "$RUNNER_TEMP/base-map.ts"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Compare the map with npm
        run: |
          if [ -f "$RUNNER_TEMP/base-map.ts" ]; then
            node scripts/homes/npm-drift.ts --check --base "$RUNNER_TEMP/base-map.ts"
          else
            node scripts/homes/npm-drift.ts --check
          fi

  # The index of the exports of the home packages (packages/conventions/src/home-exports.ts) against npm. The rule
  # home-package reads it to say "import the name from the home" or "add the name to the home". A release of a home
  # with new exports makes the index old. On 2026-11-15 it named conventions 0.32.0 (npm: 0.41.10), and 18 home packages
  # were not in it. This job runs each day and by hand, not on a pull request: a release of a home is not a fault of a
  # pull request. A red run on main goes to the owner of the map, who commits the new index and releases conventions. The
  # homes release each day, so the job writes the new index itself and uploads it as the artifact home-exports. Then the
  # owner needs no install and no build on their computer: the summary gives the command that downloads the file.
  # A home with new names has a grace of 7 days from the first version with the new names (GRACE_DAYS of
  # scripts/homes/exports.ts). In the grace, the compare passes with a warning and the output stale, and the job also
  # writes and uploads the new index. Thus one refresh takes the releases of a week, and main stays green between the
  # refreshes.
  exports:
    name: The index of the exports of the homes against npm
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compare the index with npm
        id: compare
        run: node scripts/homes/exports.ts --check
      # Only an old index writes a new one: a failed read of npm also fails the compare, and then the write fails too. An
      # index in its grace also writes a new one.
      - name: Write the index again
        id: write
        if: (failure() && steps.compare.outcome == 'failure') || steps.compare.outputs.stale == 'true'
        env:
          RUN_ID: ${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/homes/exports.ts
          if git diff --quiet -- packages/conventions/src/home-exports.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "### The index of the exports of the homes"
            echo
            echo "The job wrote \`packages/conventions/src/home-exports.ts\` again, in the artifact \`home-exports\`. To commit it, start this command at the root of the repository, and examine the diff:"
            echo
            echo '```sh'
            echo "gh run download $RUN_ID -R $REPOSITORY -n home-exports -D packages/conventions/src"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the index
        if: (failure() || steps.compare.outputs.stale == 'true') && steps.write.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: home-exports
          path: packages/conventions/src/home-exports.ts
          retention-days: 7
          if-no-files-found: error
