# Makes pnpm-lock.yaml again on a runner, for the branch that the run starts on (reusable-lockfile.yml):
#
#   gh workflow run lockfile.yml -R <owner/repo> --ref <branch>
#
# A dispatch on the default branch fails. The job "lockfile" of actions-test.yml tests the shared workflow on
# each pull request of the template that changes it.
name: Lockfile

on:
  workflow_dispatch:

permissions: {}

# One run for each branch: a new start cancels the older one
concurrency:
  group: lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    uses: ./.github/workflows/reusable-lockfile.yml
    permissions:
      contents: read
