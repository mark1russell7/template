# Makes pnpm-lock.yaml again on a runner, for the branch that the run starts on (reusable-lockfile.yml):
#
#   gh workflow run lockfile.yml -R mark1russell7/template --ref <branch>
name: Lockfile

on:
  workflow_dispatch:

permissions: {}

jobs:
  lockfile:
    uses: ./.github/workflows/reusable-lockfile.yml
    permissions:
      contents: read
