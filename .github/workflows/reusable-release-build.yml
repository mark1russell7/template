# The build job of the standard npm release (RELEASING.md, CI.md). The release.yml of a repository
# calls it after its CI gates.
#
# The job builds and packs each published package (scripts/release/pack.mjs of the repository), and
# writes the plan of the git tags and the GitHub releases (scripts/release/tags.mjs). It uploads two
# artifacts of the run: "release" (packages.txt and the tarballs) for the publish job, and "tags"
# (tags.json) for reusable-release-tag.yml.
#
# The job installs and runs the code of the repository, so it gets only "contents: read". It has no
# OIDC token: the publish job of release.yml does the publish (the npm-publish action).
name: Reusable release build

on:
  workflow_call:
    inputs:
      node-version:
        description: The Node.js version of the build.
        type: string
        default: "26"
      build:
        description: A bash command that builds the packages. Empty runs the build script of the root package.json, or else the build script of each package.
        type: string
        default: ""

jobs:
  pack:
    name: Build, pack and plan the tags
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache: a release installs from the registry and the lockfile only.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # The build input, or the build script of the root package.json, or else the build script of each package
      - name: Build
        shell: bash
        env:
          COMMAND: ${{ inputs.build }}
        run: |
          if [ -n "$COMMAND" ]; then
            eval "$COMMAND"
          elif node -e 'process.exit(require("./package.json").scripts?.build ? 0 : 1)'; then
            pnpm run build
          else
            pnpm -r --if-present run build
          fi
      - run: node scripts/release/pack.mjs "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30
      # The tag, the prerelease flag and the release text of each published package, for the tag job
      - run: node scripts/release/tags.mjs "$RUNNER_TEMP/tags.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tags
          path: ${{ runner.temp }}/tags.json
          if-no-files-found: error
          retention-days: 30
