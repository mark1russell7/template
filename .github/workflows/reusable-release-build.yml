# The build job of the standard npm release (RELEASING.md, CI.md). The release.yml of a repository
# calls it after its CI gates.
#
# The job builds and packs each published package (scripts/release/pack.mjs of the template commit of
# this file, so a repository needs no copy of scripts/release), and
# writes the plan of the git tags and the GitHub releases (scripts/release/tags.mjs). It uploads two
# artifacts of the run: "release" (packages.txt and the tarballs) for the publish job, and "tags"
# (tags.json) for reusable-release-tag.yml.
#
# The job installs and runs the code of the repository, so it gets only "contents: read". It has no
# OIDC token: the publish job of release.yml does the publish (the npm-publish action).
#
# A release publishes only a commit on main (RELEASING.md). The first step of the job stops the run
# when the commit is not the head of main or an older commit of main, for example a manual run
# (workflow_dispatch) on the branch of a pull request. Then the publish job and the tag job do not
# start. A temporary branch release/<version> at a version commit of main passes the check.
#
# The input after-pack is a command of the repository after the pack and the plan, for example a
# test of the tarballs. It runs in this job, with "contents: read" only. Its outputs go to the
# output after-pack, for a later job of release.yml, for example a publish to a second registry.
name: Reusable release build

on:
  workflow_call:
    inputs:
      require-main:
        description: true stops the job when the commit of the run is not on main. Only actions-test.yml of the template sets false, for the commit of a pull request.
        type: boolean
        default: true
      node-version:
        description: The Node.js version of the build.
        type: string
        default: "26"
      node-version-file:
        description: A file with the Node.js version of the build, for example .nvmrc. It replaces node-version.
        type: string
        default: ""
      build:
        description: A bash command that builds the packages. Empty runs the build script of the root package.json, or else the build script of each package.
        type: string
        default: ""
      after-pack:
        description: A bash command after pack.mjs and tags.mjs, before the uploads. RELEASE_DIR is the folder of packages.txt and the tarballs. TAGS_FILE is the plan of the tags. Empty runs no command.
        type: string
        default: ""
    outputs:
      after-pack:
        description: Each name=value that the after-pack command wrote to GITHUB_OUTPUT, as a JSON object. Without the command, "{}".
        value: ${{ jobs.pack.outputs.after-pack }}

jobs:
  pack:
    name: Build, pack and plan the tags
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      after-pack: ${{ toJSON(steps.after-pack.outputs) }}
    steps:
      # The first step, before the checkout: a release publishes only a commit on main. The GitHub
      # compare API (main...<commit>) gives "identical" for the head of main and "behind" for an
      # older commit of main. "ahead" and "diverged" are commits that main does not have.
      - name: The commit is on main
        if: inputs.require-main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status); then
            echo "::error::GitHub did not compare the commit $GITHUB_SHA with main. Start the run again."
            exit 1
          fi
          echo "The commit $GITHUB_SHA ($GITHUB_REF) compared with main: $status"
          if [ "$status" != identical ] && [ "$status" != behind ]; then
            echo "::error::A release runs only for a commit that is on main. The commit $GITHUB_SHA of $GITHUB_REF is not on main (status: $status). Merge it to main, then start the release on main."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache: a release installs from the registry and the lockfile only.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ inputs.node-version-file }}
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # The build input, or the build script of the root package.json, or else the build script of each package
      - name: Build
        shell: bash
        env:
          COMMAND: ${{ inputs.build }}
        run: |
          if [ -n "$COMMAND" ]; then
            eval "$COMMAND"
          elif node -e 'process.exit(require("./package.json").scripts?.build ? 0 : 1)'; then
            pnpm run build
          else
            pnpm -r --if-present run build
          fi
      # The release scripts of the same template commit as this file, not a copy in the repository
      - name: Get the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-template
          sparse-checkout: scripts/release
          persist-credentials: false
      - run: node .release-template/scripts/release/pack.mjs "$RUNNER_TEMP/release"
        env:
          RELEASE_REPO: ${{ github.workspace }}
      # The tag, the prerelease flag and the release text of each published package, for the tag job
      - run: node .release-template/scripts/release/tags.mjs "$RUNNER_TEMP/tags.json"
        env:
          RELEASE_REPO: ${{ github.workspace }}
      # The input after-pack. It can test the tarballs, add files to the artifact "release", and
      # change the plan, for example add "title" or "tarballs" (reusable-release-tag.yml). Each line
      # name=value that it writes to GITHUB_OUTPUT goes to the output after-pack of this workflow.
      - name: After the pack
        id: after-pack
        if: inputs.after-pack != ''
        shell: bash
        env:
          COMMAND: ${{ inputs.after-pack }}
          RELEASE_DIR: ${{ runner.temp }}/release
          TAGS_FILE: ${{ runner.temp }}/tags.json
        run: eval "$COMMAND"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tags
          path: ${{ runner.temp }}/tags.json
          if-no-files-found: error
          retention-days: 30
