# The audit of the time limits: it finds each job of a run of a default branch that stopped at its limit.
# `scripts/limit-audit/main.ts` reads the runs of each public repository of the account that started in the last
# 24 hours. A job at its timeout-minutes is cancelled, and the job coverage of reusable-ci.yml stops at its deadline
# or warns above 80 % of its limit. The summary of the run has a table of the jobs, and the artifact limit-audit has
# limit-audit.json. A daily run of 24 hours costs about 1 in 7 of the reads of a weekly run of 7 days. Thus each run
# stays under the limit of the token of GitHub Actions, 1000 reads each hour.
# The scheduled run fails when the audit could not read a repository. A job that stopped at a limit gives a warning
# until the day FAILS_FROM, and from that day it fails the run. Each warning names the repository, the workflow, the
# job, its limit and the run. The audit is not a gate of pull requests. To test a change, start the workflow by hand
# on its branch, with strict false.
name: Limit audit

on:
  workflow_dispatch:
    inputs:
      repos:
        description: "The repositories to examine, with commas. Empty: each public repository of the account that is not archived."
        type: string
        default: ""
      hours:
        description: The runs that started in this number of hours before the audit.
        type: string
        default: "24"
      strict:
        description: "true: the run fails when the audit could not read a repository, or, from FAILS_FROM, when a job stopped at a limit."
        type: boolean
        default: true
  # Each day, so each run reads only one day of runs
  schedule:
    - cron: "50 6 * * *"

permissions: {}

concurrency:
  group: limit-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/limit-audit
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Limit audit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOS: ${{ inputs.repos }}
          HOURS: ${{ inputs.hours || '24' }}
          # Until this day, a stop gives a warning and the run stays green. From this day, a stop fails the run.
          FAILS_FROM: "2026-11-23"
          # The schedule is strict. A start by hand is strict when its input strict is true.
          STRICT: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.strict) }}
        run: |
          set -euo pipefail
          args=(--repos "$REPOS" --hours "$HOURS" --fails-from "$FAILS_FROM" --out "$RUNNER_TEMP/limit-audit")
          if [ "$STRICT" = "true" ]; then args+=(--strict); fi
          node scripts/limit-audit/main.ts "${args[@]}"
      - name: The report of the audit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: limit-audit
          path: ${{ runner.temp }}/limit-audit
          if-no-files-found: warn
