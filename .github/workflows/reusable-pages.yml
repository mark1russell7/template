# The shared GitHub Pages deployment of the sites of mark1russell7 (CI.md).
#
#   ref     Decides if the commit of the event builds and deploys (.github/actions/build-ref/ref.ts). It runs no
#           code of the repository. Its step summary tells the decision and its reason.
#   build   Checks out the commit of the event (github.sha) with no ref of its own. The action site-config reads the
#           site config (.github/site.json, or the inputs below when the repository has no such file). The action
#           pages-build installs, builds the site, adds the Releases page and the Status page, checks the pages in a
#           browser (site-check: true), and uploads the Pages artifact. reusable-pages-check.yml uses the same two
#           actions on a pull request. The job gets only read permissions. A failed check uploads nothing, so the job
#           deploy does not start.
#   deploy  Deploys the artifact to GitHub Pages. It runs no code of the repository. It has no
#           "permissions" key: it gets "pages: write" and "id-token: write" from the caller job.
#
# The rules of the job ref:
#   - A push to the default branch deploys its commit. A pull request and a push to a different branch only build.
#   - A schedule, a run by hand, a repository dispatch and a run after a release deploy the head of the default
#     branch when its CI passed, or while its CI runs when the input pending is "head". A red head deploys nothing,
#     so the site keeps its last deploy.
#   - A run after CI deploys only when the commit of CI is the head of the default branch. Else the CI run of
#     the newer commit deploys it.
#   - A "workflow_run" for a failed run, for a pull request or for a push to a different branch starts nothing.
#
# The jobs use the actions of the same commit of the template as this file: a second checkout gets them
# (job.workflow_repository and job.workflow_sha).
name: Reusable Pages

on:
  workflow_call:
    inputs:
      site-config:
        description: The path of the site config in the repository (CI.md, "The site config"). When the file is absent, the inputs below give the site.
        type: string
        default: .github/site.json
      build:
        description: The bash command that builds the site, after the install. It can have more lines. A repository with a site config gives it there, not here.
        type: string
        default: ""
      out:
        description: The built output folder of the site, relative to the root of the repository, for example packages/site/dist.
        type: string
        default: ""
      env:
        description: Environment variables for the install and the build, as a JSON object.
        type: string
        default: "{}"
      github-token:
        description: "true: the build gets GITHUB_TOKEN in its environment, with the read permissions of the build job."
        type: boolean
        default: false
      node-version:
        description: The Node.js version.
        type: string
        default: "26"
      node-version-file:
        description: A file with the Node.js version, for example .nvmrc. It replaces node-version.
        type: string
        default: ""
      fetch-depth:
        description: The number of commits that the checkout gets. 0 (the default) gets the whole history, for the dates of the tags and of the pages.
        type: number
        default: 0
      ci-workflow:
        description: The file name of the CI workflow, for green-main.
        type: string
        default: ci.yml
      pending:
        description: What a run on the head of the default branch does while its CI runs, "head" (deploy) or "green" (deploy nothing).
        type: string
        default: head
      site-pages:
        description: "true: add the Releases page and the Status page with the site-pages action."
        type: boolean
        default: true
      site-pages-version:
        description: The version range of @mark1russell7/site-pages. Empty gives the default range of the site-pages action.
        type: string
        default: ""
      roadmap:
        description: The roadmap file for the Status page (the input of site-pages).
        type: string
        default: ""
      base:
        description: The path of the site home (the input of site-pages).
        type: string
        default: ""
      packages:
        description: npm names or a @scope, separated by commas (the input of site-pages).
        type: string
        default: ""
      changesets:
        description: The changelog files, as a glob (the input of site-pages).
        type: string
        default: ""
      group:
        description: The npm name of the package that gives the versions of a fixed group (the input of site-pages).
        type: string
        default: ""
      css:
        description: A CSS file for the pages (the input of site-pages).
        type: string
        default: ""
      site-name:
        description: The name of the site in the page titles (the input of site-pages).
        type: string
        default: ""
      data-only:
        description: "true: write only the JSON data of the pages (the input of site-pages)."
        type: boolean
        default: false
      data-stamps:
        description: The file of data stamps of the measured pages (schema data-stamp/1). The job fails on a page with no versions or no run date, on old data with no newer run in flight, and on a run that started behind npm. Empty runs no gate.
        type: string
        default: ""
      site-check:
        description: "true: before the upload, check the built pages in a headless Chromium at phone and desktop widths, in light and dark (site-pages check). A failed check stops the deploy."
        type: boolean
        default: false
      site-check-pages:
        description: The pages to check, from the site home, separated by commas. Empty checks the home only.
        type: string
        default: ""
      site-check-widths:
        description: The widths of the check in CSS pixels, separated by commas. Empty gives 360,400,1280.
        type: string
        default: ""
      site-check-probe:
        description: A JavaScript or TypeScript file of the repository that tests the interactive core of the home (the probe of site-pages check).
        type: string
        default: ""
      site-check-playwright:
        description: The version of playwright-core whose Chromium the check uses.
        type: string
        default: "1.64.1"
      artifact-prefix:
        description: >-
          A prefix of the names of the artifacts github-pages and site-check, for example "test-". Two calls in one run
          need two prefixes, because a download by name gets only the latest artifact of the name.
        type: string
        default: ""
      site-bar:
        description: "true: write the shared site bar into each built HTML page (site-pages bar), and crawl the built site from its home (site-pages nav). A page with no bar, a page more than 2 clicks from home or a page with no way back stops the deploy."
        type: boolean
        default: false
      site-bar-pages:
        description: The pages of the site in the bar, after the home, as label=path pairs separated by commas, for example "Demo=demo/,Docs=docs/". With site-pages, the bar also links to Releases and Status.
        type: string
        default: ""
      site-bar-npm:
        description: The npm name of the package of the site, for the npm link of the bar. Empty gives no npm link.
        type: string
        default: ""
      scroll-cue:
        description: "true: give each code block (pre) of each built HTML page the scroll cue of site-pages (site-pages cue). A block that is wider than its box then shows a fade at the edge with more content. A block with data-overflow-ok stays as it is."
        type: boolean
        default: true
      deploy:
        description: "false: build and upload the artifact, but do not deploy it."
        type: boolean
        default: true
      indexnow-key:
        description: "A key of IndexNow. After each deploy that is not scheduled, the job indexnow sends the URLs of sitemap.xml to the engines. The site serves <key>.txt with the key."
        type: string
        default: ""
      timeout-minutes:
        description: The time limit of the build job.
        type: number
        default: 20
    outputs:
      page-url:
        description: The URL of the deployed site.
        value: ${{ jobs.deploy.outputs.page-url }}

jobs:
  # Decides if the job build builds and if the job deploy deploys. The job build checks out the commit of the event
  # (github.sha), with no ref of its own (.github/actions/build-ref/ref.ts tells the rules). A failed CI run, a CI run
  # for a pull request and a CI run for a push to a different branch start nothing (scripts/workflows/pages-guard.test.ts).
  ref:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') && github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # green-main reads the Actions runs.
      actions: read
    outputs:
      build: ${{ steps.ref.outputs.build }}
      deploy: ${{ steps.ref.outputs.deploy }}
    steps:
      # Without these values, the checkouts of the shared actions get the caller repository, not the template.
      - name: The commit of this workflow file
        shell: bash
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          echo "This workflow file is from $WORKFLOW_REPOSITORY at $WORKFLOW_SHA."
          if [ -z "$WORKFLOW_REPOSITORY" ] || ! [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::job.workflow_repository or job.workflow_sha is not available."
            exit 1
          fi
      # The actions of the template, at the commit of this file, for green-main and build-ref.
      - name: Shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-actions
          sparse-checkout: .github/actions
          persist-credentials: false
      # The commit of these events is the head of the default branch. It deploys only when its CI state allows it.
      - id: green
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || github.event.workflow_run.name == 'Release'
        uses: ./.shared-actions/.github/actions/green-main
        with:
          workflow: ${{ inputs.ci-workflow }}
          commit: ${{ github.sha }}
          pending: ${{ inputs.pending }}
      # The step writes its decision and the reason to the step summary.
      - id: ref
        uses: ./.shared-actions/.github/actions/build-ref
        with:
          state: ${{ steps.green.outputs.state }}
          pending: ${{ inputs.pending }}

  build:
    needs: ref
    if: needs.ref.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # The job indexnow reads the key of the site config, not the input.
    outputs:
      indexnow-key: ${{ fromJSON(steps.config.outputs.config)['indexnow-key'] }}
    permissions:
      contents: read
      # site-pages reads the Actions runs, the pull requests, the issues and their checks.
      actions: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      # The commit of the event, with no ref: the job ref decided that this commit builds.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          persist-credentials: false
      # The actions site-config and pages-build, and the source of the site config, the site check, the site bar, the
      # scroll cue and the freshness gate, from the same template commit. packages/site-pages/src/check and src/bar
      # import only Node.js, src/data and src/render/html.ts, and the cue reads styles/scroll-cue.css, so they need no
      # npm release of site-pages.
      - name: Shared actions (the site config, site-pages and the site check)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-actions
          sparse-checkout: |
            .github/actions
            packages/site-pages/src/bar
            packages/site-pages/src/check
            packages/site-pages/src/config
            packages/site-pages/src/data
            packages/site-pages/src/render
            packages/site-pages/styles
          persist-credentials: false
      # The values of .github/site.json, or the inputs of this workflow when the repository has no such file
      - id: config
        uses: ./.shared-actions/.github/actions/site-config
        with:
          path: ${{ inputs.site-config }}
          inputs: ${{ toJSON(inputs) }}
      - uses: ./.shared-actions/.github/actions/pages-build
        with:
          config: ${{ steps.config.outputs.config }}
          artifact-prefix: ${{ inputs.artifact-prefix }}

  deploy:
    needs: [ref, build]
    if: inputs.deploy && needs.ref.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page-url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ inputs.artifact-prefix }}github-pages

  # Tell the search engines of IndexNow (Bing and others) about the pages of the new deploy. A failure here does not
  # fail the deploy. A scheduled deploy changes only the Status page, so it sends nothing.
  indexnow:
    needs: [build, deploy]
    if: inputs.deploy && needs.build.outputs.indexnow-key != '' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-actions
          sparse-checkout: packages/site-pages/src/indexnow
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: IndexNow
        env:
          SITE: ${{ needs.deploy.outputs.page-url }}
          KEY: ${{ needs.build.outputs.indexnow-key }}
        run: node .shared-actions/packages/site-pages/src/indexnow/main.ts --site "${SITE%/}/" --key "$KEY"
