# The CI of this repository. The job ci is the shared CI of mark1russell7 (reusable-ci.yml, CI.md)
# with its default inputs: it runs each standard script that package.json has (format:check,
# typecheck, lint, check:conventions, test, build in each package that has it, check:boundaries, check:api and lint:ste).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml starts these gates before a release
  workflow_call:
  # A person starts a run on a branch with no pull request: gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels the run of a pull request. Each commit of main has its own group, so its run ends with a result (main-runs-finish).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  ci:
    uses: ./.github/workflows/reusable-ci.yml

  # Each preset of `pnpm package add` makes a package, and that package passes its typecheck and its tests.
  # The tests of the preset service hold its entry to describe() and lint() of @mark1russell7/service (OTH-5).
  # A test of the CLI compares this list with the presets of the CLI.
  # Only the template has the source of the CLI (packages/cli), so a repository from new-repo.ps1 skips this job.
  presets:
    if: github.repository == 'mark1russell7/template'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # The runners are shared by all repositories of the account (the rule runner-budget)
      max-parallel: 3
      matrix:
        preset: [node, node-cjs, ts, vite, react, service, site, electron]
    env:
      PACKAGE: demo-${{ matrix.preset }}
      PRESET: ${{ matrix.preset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Just after a release of a package of the template, the registry can give 404 for its tarball for some minutes.
      # Then the step resets the tree and tries again. Each other fault fails the step at once.
      - name: pnpm package add (again after a registry lag)
        run: |
          set -o pipefail
          for attempt in 1 2 3 4 5; do
            if pnpm package add "$PACKAGE" --preset="$PRESET" 2>&1 | tee add.log; then rm add.log; exit 0; fi
            if ! grep -qE 'ERR_PNPM_(TARBALL_HTTP_STATUS|FETCH_404|NO_MATCHING_VERSION)' add.log; then exit 1; fi
            echo "::warning::Attempt $attempt: the registry does not serve a new version yet. The step tries again in 60 s."
            git checkout -- . && git clean -fdq -e add.log
            sleep 60
          done
          exit 1
      # The new package changes the lockfile
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter "@template/$PACKAGE" typecheck
      - run: pnpm --filter "@template/$PACKAGE" test
      # A preset with the script smoke starts its app once: the electron app opens its window on a virtual display,
      # and stops with 0 when its page answers on the port. Ubuntu 24.04 refuses the user namespaces of the sandbox
      # of Chromium to a binary with no AppArmor profile, so the step allows them. The app keeps its sandbox.
      - name: smoke (a preset with the script smoke)
        run: |
          if ! jq -e '.scripts.smoke' "packages/$PACKAGE/package.json" > /dev/null; then echo "No script smoke."; exit 0; fi
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run --auto-servernum pnpm --filter "@template/$PACKAGE" smoke

  # The validator of Renovate reads each preset of renovate/ (renovate/README.md). Each repository of the account
  # extends these presets, so a fault in one of them stops Renovate in each repository.
  # Only the template has the presets, so a repository from new-repo.ps1 skips this job.
  renovate-presets:
    if: github.repository == 'mark1russell7/template'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # A custom manager of renovate/base updates this version.
      RENOVATE_VERSION: 44.262.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Validate the presets
        run: npx --yes --package "renovate@${RENOVATE_VERSION}" -- renovate-config-validator --strict renovate/*.json

  # A new repository passes its install, conventions check, typecheck, tests, Pages build and site check with no hand edit.
  # Only the template has the stamp (scripts/stamp), so a repository from the stamp skips this job.
  stamp:
    if: github.repository == 'mark1russell7/template'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DEMO: ${{ github.workspace }}/../stamp-demo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # --link: the packages of the template come from this commit, not from npm. A change of a rule and of
      # the files that the stamp writes thus passes in one pull request, before the release of the rule.
      - run: node scripts/stamp/main.ts stamp-demo --description "A repository of the stamp test." --ref HEAD --out "$DEMO" --link
      - name: The new repository installs
        run: |
          cd "$DEMO"
          pnpm install --no-frozen-lockfile
          git add -A
          git -c user.name=stamp -c user.email=stamp@example.com commit -q -m "first commit"
      # The default list of reusable-ci.yml, with each missing script skipped
      - name: The new repository passes its gates
        run: |
          cd "$DEMO"
          # The rule runner-budget reads the name of the repository from this variable
          export GITHUB_REPOSITORY=mark1russell7/stamp-demo
          for script in format:check typecheck lint check:conventions test build check:boundaries check:api lint:ste; do
            pnpm run --if-present "$script"
          done
      - name: The Pages build works
        env:
          SITE_BASE: /stamp-demo
        run: |
          cd "$DEMO"
          pnpm --filter @stamp-demo/site run build
          pnpm --filter @stamp-demo/site exec site-pages build --out dist --repo mark1russell7/stamp-demo --roadmap ../../docs/ROADMAP.md --site-name stamp-demo
      # The same browser and the same check as reusable-pages.yml
      - name: Install the browser of the site check
        run: npm install --prefix "$RUNNER_TEMP/site-check-playwright" --no-save --no-package-lock --no-audit --no-fund playwright-core@1.64.1
      - uses: ./.github/actions/setup-playwright
        with:
          command: ${{ runner.temp }}/site-check-playwright/node_modules/.bin/playwright-core
          browsers: chromium
      - name: The site passes the site check
        run: node packages/site-pages/src/check/main.ts --out "$DEMO/packages/site/dist" --repo mark1russell7/stamp-demo --pages /,/releases/,/status/ --shots "$RUNNER_TEMP/site-check"

  # The site of .github/site.json: the build, the site check and the probe, with no deploy (CI.md, "The site config").
  # pages.yml deploys the same site from main. The template calls the check workflow of its own commit.
  site:
    uses: ./.github/workflows/reusable-pages-check.yml
    permissions:
      contents: read

  # The rules of conventions of a pull request, over each public repository that uses them (CI.md, "The compare of the
  # conventions rules"). The job fails on a failure of a rule that only the pull request gives. Only the template has the
  # source of the rules, so a repository from the stamp skips this job.
  rules:
    if: github.repository == 'mark1russell7/template' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # release.yml calls this file with "contents: read" only. A job that asks for more stops each run of release.yml at
    # its start, also when its if skips the job (scripts/workflows/call-permissions.test.ts). In a public repository,
    # the token reads the files of the pull request with no "pull-requests: read".
    permissions:
      contents: read
    steps:
      # The merge commit of the pull request: its rules, and the script of the compare
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: next
          persist-credentials: false
      - id: changes
        uses: ./next/.github/actions/changes
        with:
          paths: |
            .github/workflows/ci.yml
            scripts/workflows/rule-compare.ts
            scripts/lib/gh.ts
            packages/conventions/src/**
            !packages/conventions/src/**/*.test.ts
      # The same compare of the import boundaries (CI.md, "The compare of the import boundaries")
      - id: boundary-changes
        uses: ./next/.github/actions/changes
        with:
          paths: |
            .github/workflows/ci.yml
            scripts/workflows/rule-compare.ts
            scripts/lib/gh.ts
            packages/boundaries/src/**
            !packages/boundaries/src/**/*.test.ts
      # The base of the pull request: the first parent of the merge commit, not the field base.sha of the event, which
      # GitHub does not update when main moves (actions/merge-parents)
      - id: merge
        if: steps.changes.outputs.match == 'true' || steps.boundary-changes.outputs.match == 'true'
        uses: ./next/.github/actions/merge-parents
        with:
          path: next
      # The rules that each repository gets when its pin moves to the base
      - if: steps.changes.outputs.match == 'true' || steps.boundary-changes.outputs.match == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          ref: ${{ steps.merge.outputs.base }}
          persist-credentials: false
      - if: steps.changes.outputs.match == 'true' || steps.boundary-changes.outputs.match == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: next/package.json
      - if: steps.changes.outputs.match == 'true' || steps.boundary-changes.outputs.match == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: next/pnpm-lock.yaml
      # Only the package of the rules and its dependencies. The script imports the escapes of Markdown and of workflow
      # commands, and the read of the repositories of scripts/lib/gh.ts imports the retry of @mark1russell7/service. Both
      # come at the version that pnpm-lock.yaml gives (CI.md, "The packages of the workflow scripts"), into next/scripts,
      # so that scripts/workflows and scripts/lib both find them.
      - name: Install the rules of the base and of the pull request
        if: steps.changes.outputs.match == 'true' || steps.boundary-changes.outputs.match == 'true'
        run: |
          (cd next && pnpm install --frozen-lockfile --filter "@mark1russell7/conventions...")
          (cd base && pnpm install --frozen-lockfile --filter "@mark1russell7/conventions...")
          text="$(node next/.github/actions/pull-of-run/locked-version.ts next/pnpm-lock.yaml @mark1russell7/text)"
          service="$(node next/.github/actions/pull-of-run/locked-version.ts next/pnpm-lock.yaml @mark1russell7/service)"
          npm install --no-save --no-package-lock --ignore-scripts --prefix next/scripts "@mark1russell7/text@${text}" "@mark1russell7/service@${service}"
      # The script reads the public repositories of each owner of packages/conventions/src/owners.ts that are not
      # archived. It puts out of scope each one with no dependency on the rules.
      - name: The compare of the rules
        if: steps.changes.outputs.match == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node next/scripts/workflows/rule-compare.ts --tool conventions --base base --next next --out "$RUNNER_TEMP/rule-compare/conventions" --work "$RUNNER_TEMP/rule-clones" --jobs 4
      # Each repository with a dependency on the boundaries and the script check:boundaries. The script installs each
      # clone with no scripts of the packages, and links the package of the base and then of the pull request into it.
      # The step starts also after a failure of the compare of the rules, so the summary has both compares.
      - name: The compare of the import boundaries
        if: ${{ !cancelled() && steps.boundary-changes.outputs.match == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node next/scripts/workflows/rule-compare.ts --tool boundaries --base base --next next --out "$RUNNER_TEMP/rule-compare/boundaries" --work "$RUNNER_TEMP/boundary-clones" --jobs 4
      - name: The reports of the compare
        if: ${{ !cancelled() && (steps.changes.outputs.match == 'true' || steps.boundary-changes.outputs.match == 'true') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rule-compare
          path: ${{ runner.temp }}/rule-compare
          if-no-files-found: warn

  # The one check of the ruleset of main (CI.md, "The check of the ruleset"). It passes only when
  # each job of needs passed, or was skipped by its own if and ALLOW_SKIP names it. A new job of this
  # file goes in needs, so the ruleset never has to change, and gh pr merge --auto waits for the whole gate.
  ci-ok:
    name: CI OK
    if: ${{ !cancelled() }}
    needs: [ci, presets, renovate-presets, stamp, site, rules]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Each job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          # The jobs that their own if may skip, separated by spaces. Each other job must pass.
          ALLOW_SKIP: "presets renovate-presets stamp rules"
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"' > results
          cat results
          if [ ! -s results ]; then echo "::error::no job in needs"; exit 1; fi
          bad=0
          while read -r job result; do
            case "$result" in
              success) ;;
              skipped) case " $ALLOW_SKIP " in *" $job "*) ;; *) echo "::error::$job was skipped, and ALLOW_SKIP does not name it"; bad=1 ;; esac ;;
              *) echo "::error::$job: $result"; bad=1 ;;
            esac
          done < results
          exit $bad
