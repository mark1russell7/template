name: TC running
on:
  pull_request:
permissions: {}
jobs:
  work:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          gh run cancel "$RUN" -R "$REPO"
          sleep 240
  ok:
    name: TC running OK
    if: ${{ !cancelled() }}
    needs: [work]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"' | tee results
          [ -s results ] || exit 1
          ! grep -qv ' success$' results
