name: site-config
description: >-
  Gives the site config of the repository as one JSON output: the values of .github/site.json, or the old inputs of
  reusable-pages.yml when the repository has no file. config.ts tells the rules. The step runs no code of the repository.
inputs:
  path:
    description: The path of the site config in the repository.
    default: .github/site.json
  root:
    description: The folder of the checkout of the repository.
    default: .
  inputs:
    description: The inputs of the workflow as JSON (toJSON(inputs)), or empty when the workflow has no old inputs.
    default: ""
outputs:
  config:
    description: The site config as JSON. Each key of config.ts (SITE_KEYS) has a value.
    value: ${{ steps.config.outputs.config }}
  source:
    description: '"file" when the values come from the file, or "inputs" when they come from the inputs of the workflow.'
    value: ${{ steps.config.outputs.source }}
runs:
  using: composite
  steps:
    - id: config
      name: Site config
      shell: bash
      env:
        CONFIG_PATH: ${{ inputs.path }}
        CONFIG_ROOT: ${{ inputs.root }}
        INPUTS: ${{ inputs.inputs }}
        SCRIPT: ${{ github.action_path }}/config.ts
      # Node 22.18 and later run TypeScript with no build. The ubuntu-latest image has such a Node.
      run: node "$SCRIPT"
