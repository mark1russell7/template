name: npm-publish
description: >-
  Publishes each tarball of the release artifact whose version npm does not have, with npm trusted publishing (OIDC)
  and a provenance statement. It runs in the publish job of release.yml, which holds "id-token: write" and checks out
  no code of the repository.
# A composite action runs in the job that uses it. Thus the OIDC token names the release.yml of the repository, and
# the trusted publisher of each package on npm (repository and release.yml) stays the same (CI.md).
inputs:
  artifact:
    description: The name of the artifact of reusable-release-build.yml, with packages.txt and the tarballs.
    default: release
  node-version:
    description: The Node.js version. Trusted publishing needs npm 11.5.1 or later.
    default: "26"
  dry-run:
    description: '"true": find the versions to publish, but publish none (the test of actions-test.yml).'
    default: "false"
  new-packages:
    description: >-
      What a package that is not on npm gives, after the publish of the other packages. "error": the step fails.
      "warning": the step gives a warning and does not fail.
    default: error
outputs:
  published:
    description: The versions that this step published, "name@version" with a space between them.
    value: ${{ steps.publish.outputs.published }}
runs:
  using: composite
  steps:
    # No registry-url: with it, setup-node writes `_authToken=${NODE_AUTH_TOKEN}` to an .npmrc, and that empty token
    # can stop the OIDC exchange. The default registry is npmjs.org.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false
    - name: npm is 11.5.1 or later
      shell: bash
      run: |
        npm_version="$(npm --version)"
        if ! node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$npm_version"; then
          echo "::error::npm $npm_version cannot do trusted publishing. It must be 11.5.1 or later."
          exit 1
        fi
        echo "npm $npm_version"
    # The folder is in the temporary folder of the runner, not in the workspace: npm reads no .npmrc of a checkout.
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/npm-publish/release
    # packages.txt has one line for each tarball, "name version file", in the sequence of their dependencies. npm
    # publishes each tarball as it is, with no package scripts. The path starts with ./ because npm reads
    # "release/x.tgz" as a GitHub repository (user/repo).
    # npm limits the requests of one account (HTTP 429), and Sigstore can fail once (a 502, then a 409 for the entry
    # that it wrote). npm does not send a request again by itself here: the step waits, and then starts a new publish
    # with a new signature.
    # The query string of each request goes around the cache of the registry. Without it, a package that the owner
    # bootstrapped some minutes before can still get a cached 404. The registry itself can also need some minutes for
    # a new package, so a 404 gets 5 more tries, 30 seconds apart, before the step counts the package as new.
    # The output "published" tells the tag job which versions this run published. The trap writes it also when the
    # step stops with an error after some publishes.
    # When npm refuses a publish, trust_hints tells the cause of the two known failures of the trusted publisher. The
    # debug log of npm (--logs-dir) has the verbose lines of the OIDC exchange, which the output of npm does not show.
    # The action has no registry-url, so after a failed exchange npm has no token and stops with ENEEDAUTH.
    #   - "OIDC token exchange error - package not found", or a 404: npm/cli#9969. npm does not match a trusted
    #     publisher that names a GitHub environment for a repository with the immutable OIDC subject of GitHub.
    #   - ENEEDAUTH: npm got no token. The trusted publisher is missing, or it expired: a new trust expires when no
    #     publish uses it in 2 days.
    # The hints do not change the result of the step.
    - name: Publish
      id: publish
      shell: bash
      working-directory: ${{ runner.temp }}/npm-publish
      env:
        DRY_RUN: ${{ inputs.dry-run }}
        NEW_PACKAGES: ${{ inputs.new-packages }}
      run: |
        set -o pipefail
        if [ "$NEW_PACKAGES" != error ] && [ "$NEW_PACKAGES" != warning ]; then
          echo "::error::The input new-packages is \"$NEW_PACKAGES\". It must be \"error\" or \"warning\"."
          exit 1
        fi
        published=()
        trap 'echo "published=${published[*]}" >> "$GITHUB_OUTPUT"' EXIT
        trust_hints() {
          if grep -qsE "OIDC token exchange error - package not found|POST 404 [^ ]*/-/npm/v1/oidc/token/exchange/|code E404" publish.log npm-logs/*.log; then
            echo "::error::npm refused the OIDC token exchange for $1 (\"package not found\" or 404, npm/cli#9969). For a repository with the immutable OIDC subject of GitHub, the trusted publisher must name no GitHub environment. RELEASING.md tells how to correct it."
          fi
          if grep -qs "ENEEDAUTH" publish.log; then
            echo "::error::npm got no token for $1 (ENEEDAUTH): the trusted publisher is missing or expired. A new trust expires when no publish uses it in 2 days. The owner starts scripts/release/npm-bootstrap.mjs --replace-trust again, then this workflow (RELEASING.md)."
          fi
        }
        new_packages=()
        while read -r name version file; do
          [ -n "$name" ] || continue
          for try in 1 2 3 4 5 6; do
            status=$(curl -sS -o packument.json -w '%{http_code}' "https://registry.npmjs.org/${name//\//%2f}?t=$(date +%s%N)")
            [ "$status" = "404" ] && [ "$try" != 6 ] || break
            echo "The registry gives 404 for $name. The next look starts in 30 seconds."
            sleep 30
          done
          if [ "$status" = "404" ]; then
            new_packages+=("$name")
            continue
          elif [ "$status" != "200" ]; then
            echo "::error::The registry gave HTTP $status for $name."
            exit 1
          fi
          if node -e 'process.exit(require("./packument.json").versions?.[process.argv[1]] ? 0 : 1)' "$version"; then
            echo "$name $version is on npm."
            continue
          fi
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          if [ "$DRY_RUN" = true ]; then
            echo "Dry run: npm publish ./release/$file --access public --provenance --tag $tag"
            continue
          fi
          for attempt in 1 2 3; do
            rm -rf npm-logs
            if npm publish "./release/$file" --access public --provenance --tag "$tag" --fetch-retries 0 --logs-dir "$PWD/npm-logs" 2>&1 | tee publish.log; then
              break
            fi
            if ! grep -qE "E429|E5[0-9][0-9]|TLOG_CREATE_ENTRY_ERROR|ETIMEDOUT|ECONNRESET" publish.log || [ "$attempt" = 3 ]; then
              echo "::error::npm did not publish $name $version."
              trust_hints "$name"
              exit 1
            fi
            echo "npm or Sigstore gave a temporary error (429, 5xx, or a transparency-log conflict). The next try starts in $((attempt * 60)) seconds."
            sleep $((attempt * 60))
          done
          published+=("$name@$version")
        done < release/packages.txt
        if [ ${#new_packages[@]} -gt 0 ] && [ "$NEW_PACKAGES" = warning ]; then
          echo "::warning::These packages are not on npm, and this run did not publish them: ${new_packages[*]}. The owner bootstraps each new package once (RELEASING.md)."
        elif [ ${#new_packages[@]} -gt 0 ]; then
          echo "::error::These packages are not on npm: ${new_packages[*]}. The owner bootstraps each new package once (RELEASING.md), then starts this workflow again."
          exit 1
        fi
