name: setup-playwright
description: >-
  Installs the Playwright browsers and their system packages from a cache, with a time limit and one more try, so
  that a slow package mirror or a hung download does not hold the job until its timeout. With packages
  "best-effort", the system packages get one try with a time limit, and a failed try does not fail the step when
  each browser starts. The step needs Node.js 22.18 or later.
inputs:
  browsers:
    description: The browsers, separated by spaces (for example "chromium firefox webkit").
    default: chromium
  command:
    description: >-
      The command that runs the Playwright CLI of the repository, for example
      "pnpm --filter @vex/site exec playwright". It must give the same Playwright version as the tests.
    default: npx --no-install playwright
  working-directory:
    description: The directory where the command runs.
    default: .
  timeout-minutes:
    description: The time limit of each try of an install, in minutes (a whole number of 1 or more).
    default: "12"
  attempts:
    description: >-
      The number of tries of each install (the browsers, then the system packages with "required"), a whole number of
      1 or more.
    default: "2"
  packages:
    description: >-
      "required": the system packages get the tries of attempts and timeout-minutes, and a failure of the last try
      fails the step. "best-effort": the system packages get one try of best-effort-minutes. When that try fails or
      reaches its limit, the step starts each browser. When each browser starts, the step warns, sets the output
      packages to "missing" and passes. When a browser does not start, the step fails.
    default: required
  best-effort-minutes:
    description: >-
      The time limit of the one try of the system packages with "best-effort", in minutes (a whole number of 1 or
      more). In one measured run, a try with a cache hit took 207 seconds during an outage of the package mirror.
    default: "5"
outputs:
  version:
    description: The Playwright version.
    value: ${{ steps.version.outputs.version }}
  cache-hit:
    description: '"true" when the browsers and the system packages came from the cache.'
    value: ${{ steps.cache.outputs.cache-hit }}
  packages:
    description: >-
      "installed" when the system packages are installed, "missing" when the input packages is "best-effort" and they
      are not. A job that needs the fonts (a pixel comparison, a text measure) can refuse "missing".
    value: ${{ steps.install.outputs.packages }}
  packages-cause:
    description: >-
      Empty with "installed". With "missing": "failed" when the try of the system packages ended with an error, and
      "time-limit" when it reached best-effort-minutes.
    value: ${{ steps.install.outputs.packages-cause }}
runs:
  using: composite
  steps:
    - id: version
      name: The Playwright version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        COMMAND: ${{ inputs.command }}
        BROWSERS: ${{ inputs.browsers }}
        PACKAGES: ${{ inputs.packages }}
        MINUTES: ${{ inputs.timeout-minutes }}
        ATTEMPTS: ${{ inputs.attempts }}
        BEST_EFFORT_MINUTES: ${{ inputs.best-effort-minutes }}
        SCRIPT: ${{ github.action_path }}/install.ts
      run: |
        # The script of the action is TypeScript. Node.js starts a .ts file from 22.18.
        if ! node -e 'process.exit(process.features.typescript ? 0 : 1)'; then
          echo "::error::Node.js $(node --version) cannot start the script of the action setup-playwright (Node.js 22.18 or later can)."
          exit 1
        fi
        # The inputs are checked before the cache step.
        node "$SCRIPT" check
        version=$($COMMAND --version | awk '{print $NF}')
        [ -n "$version" ] || { echo "::error::\"$COMMAND --version\" gave no version."; exit 1; }
        # One browser folder on each OS, so that the cache path is the same everywhere.
        echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "browsers=$(echo $BROWSERS | tr ' ' '-')" >> "$GITHUB_OUTPUT"
        echo "image=${ImageOS:-$RUNNER_OS}" >> "$GITHUB_OUTPUT"
    - name: Keep the downloaded system packages for the cache
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # apt keeps its .deb files in a folder that the cache can write, and waits for the dpkg lock in place of a
        # failure at once.
        mkdir -p "$HOME/.cache/apt-archives/partial"
        printf '%s\n' \
          "Dir::Cache::Archives \"$HOME/.cache/apt-archives\";" \
          'APT::Keep-Downloaded-Packages "true";' \
          'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
          'DPkg::Lock::Timeout "180";' \
          'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99-setup-playwright > /dev/null
        sudo rm -f /etc/apt/apt.conf.d/docker-clean
    # The restore and the save are two steps, so that a run with missing system packages saves no cache. A cache with
    # the browsers and no .deb files would stay under its key, and each later run would download the packages again.
    - id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/ms-playwright
          ~/.cache/apt-archives/*.deb
        key: playwright-${{ runner.os }}-${{ steps.version.outputs.image }}-${{ steps.version.outputs.version }}-${{ steps.version.outputs.browsers }}
    - id: install
      name: Install the browsers, then their system packages
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        COMMAND: ${{ inputs.command }}
        BROWSERS: ${{ inputs.browsers }}
        HIT: ${{ steps.cache.outputs.cache-hit }}
        MINUTES: ${{ inputs.timeout-minutes }}
        ATTEMPTS: ${{ inputs.attempts }}
        PACKAGES: ${{ inputs.packages }}
        BEST_EFFORT_MINUTES: ${{ inputs.best-effort-minutes }}
        SCRIPT: ${{ github.action_path }}/install.ts
      run: node "$SCRIPT" install
    - name: Save the browsers and the system packages in the cache
      if: steps.cache.outputs.cache-hit != 'true' && steps.install.outputs.packages == 'installed'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/ms-playwright
          ~/.cache/apt-archives/*.deb
        key: ${{ steps.cache.outputs.cache-primary-key }}
