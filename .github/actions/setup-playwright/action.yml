name: setup-playwright
description: >-
  Installs the Playwright browsers and their system packages from a cache, with a time limit and one more try, so
  that a slow package mirror or a hung download does not hold the job until its timeout. With packages
  "best-effort", the system packages get one try with a time limit, and a failed try does not fail the step when
  each browser starts. The step needs Node.js 22.18 or later.
inputs:
  browsers:
    description: The browsers, separated by spaces (for example "chromium firefox webkit").
    default: chromium
  command:
    description: >-
      The command that runs the Playwright CLI of the repository, for example
      "pnpm --filter @vex/site exec playwright". It must give the same Playwright version as the tests.
    default: npx --no-install playwright
  working-directory:
    description: The directory where the command runs.
    default: .
  timeout-minutes:
    description: The time limit of each try of an install, in minutes (a whole number of 1 or more).
    default: "12"
  attempts:
    description: >-
      The number of tries of each install (the browsers, then the system packages with "required"), a whole number of
      1 or more.
    default: "2"
  packages:
    description: >-
      "required": the system packages get the tries of attempts and timeout-minutes, and a failure of the last try
      fails the step. "best-effort": the system packages get one try of best-effort-minutes. When that try fails or
      reaches its limit, the step starts each browser. When each browser starts, the step warns, sets the output
      packages to "missing" and passes. When a browser does not start, the step fails.
    default: required
  best-effort-minutes:
    description: >-
      The time limit of the one try of the system packages with "best-effort", in minutes (a whole number of 1 or
      more). In one measured run, a try with a cache hit took 207 seconds during an outage of the package mirror.
    default: "5"
outputs:
  version:
    description: The Playwright version.
    value: ${{ steps.version.outputs.version }}
  cache-hit:
    description: '"true" when the browsers and the system packages came from the cache.'
    value: ${{ steps.cache.outputs.cache-hit }}
  packages:
    description: >-
      "installed" when the system packages are installed, "missing" when the input packages is "best-effort" and they
      are not. A job that needs the fonts (a pixel comparison, a text measure) can refuse "missing".
    value: ${{ steps.install.outputs.packages }}
  packages-cause:
    description: >-
      Empty with "installed". With "missing": "failed" when the try of the system packages ended with an error, and
      "time-limit" when it reached best-effort-minutes.
    value: ${{ steps.install.outputs.packages-cause }}
runs:
  using: composite
  steps:
    - id: version
      name: The Playwright version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        COMMAND: ${{ inputs.command }}
        BROWSERS: ${{ inputs.browsers }}
        PACKAGES: ${{ inputs.packages }}
        MINUTES: ${{ inputs.timeout-minutes }}
        ATTEMPTS: ${{ inputs.attempts }}
        BEST_EFFORT_MINUTES: ${{ inputs.best-effort-minutes }}
        SCRIPT: ${{ github.action_path }}/install.ts
      run: |
        # The script of the action is TypeScript. Node.js starts a .ts file from 22.18.
        if ! node -e 'process.exit(process.features.typescript ? 0 : 1)'; then
          echo "::error::Node.js $(node --version) cannot start the script of the action setup-playwright (Node.js 22.18 or later can)."
          exit 1
        fi
        # The inputs are checked before the cache step.
        node "$SCRIPT" check
        version=$($COMMAND --version | awk '{print $NF}')
        [ -n "$version" ] || { echo "::error::\"$COMMAND --version\" gave no version."; exit 1; }
        # A Playwright version that does not know the runner image stops at once with the fix, not after each try.
        node "$SCRIPT" host "$version"
        # One browser folder on each OS, so that the cache path is the same everywhere.
        echo "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" >> "$GITHUB_ENV"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "browsers=$(echo $BROWSERS | tr ' ' '-')" >> "$GITHUB_OUTPUT"
        echo "image=${ImageOS:-$RUNNER_OS}" >> "$GITHUB_OUTPUT"
    - name: Keep the downloaded system packages for the cache
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # apt keeps its .deb files in a folder that the cache can write, and waits for the dpkg lock in place of a
        # failure at once.
        mkdir -p "$HOME/.cache/apt-archives/partial"
        printf '%s\n' \
          "Dir::Cache::Archives \"$HOME/.cache/apt-archives\";" \
          'APT::Keep-Downloaded-Packages "true";' \
          'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
          'DPkg::Lock::Timeout "180";' \
          'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99-setup-playwright > /dev/null
        sudo rm -f /etc/apt/apt.conf.d/docker-clean
    - name: Check that apt has an Ubuntu archive
      if: runner.os == 'Linux'
      shell: bash
      env:
        # An Ubuntu source names an Ubuntu archive, the mirror list of the runner (mirror+file:) or the Ubuntu keyring.
        UBUNTU_SOURCE: '(archive|ports|security)\.ubuntu\.com|mirror\+file:|ubuntu-archive-keyring'
      run: |
        # On 2026-11-26 an ubuntu-26.04 runner had only packages.microsoft.com in its apt sources, so install-deps
        # failed at once on each font package (apt exit 100). When no source names an Ubuntu archive, this step adds the
        # archive of the release. With no Ubuntu keyring, it fails with a clear text. The GitHub runners name their
        # Ubuntu mirrors through mirror+file:/etc/apt/apt-mirrors.txt, so that form is an Ubuntu source too (2026-11-27).
        . /etc/os-release
        if [ "${ID:-}" != ubuntu ]; then exit 0; fi
        if grep -R -q -E "$UBUNTU_SOURCE" /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null; then
          exit 0
        fi
        keyring=/usr/share/keyrings/ubuntu-archive-keyring.gpg
        if [ ! -f "$keyring" ]; then
          echo "::error title=Apt sources::the runner has no Ubuntu apt source and no $keyring"
          exit 1
        fi
        case "$(dpkg --print-architecture)" in
          amd64|i386) uri=http://archive.ubuntu.com/ubuntu; security=http://security.ubuntu.com/ubuntu ;;
          *) uri=http://ports.ubuntu.com/ubuntu-ports; security=$uri ;;
        esac
        echo "::warning title=Apt sources::the runner has no Ubuntu apt source, so the step adds $uri for $VERSION_CODENAME"
        printf 'Types: deb\nURIs: %s\nSuites: %s %s-updates\nComponents: main universe restricted multiverse\nSigned-By: %s\n\nTypes: deb\nURIs: %s\nSuites: %s-security\nComponents: main universe restricted multiverse\nSigned-By: %s\n' \
          "$uri" "$VERSION_CODENAME" "$VERSION_CODENAME" "$keyring" "$security" "$VERSION_CODENAME" "$keyring" \
          | sudo tee /etc/apt/sources.list.d/setup-playwright-ubuntu.sources > /dev/null
    - name: Set aside the apt sources that the browsers do not need
      if: runner.os == 'Linux'
      shell: bash
      env:
        UBUNTU_SOURCE: '(archive|ports|security)\.ubuntu\.com|mirror\+file:|ubuntu-archive-keyring'
      run: |
        # The system packages of the browsers come only from the Ubuntu archive. On 2026-11-27 packages.microsoft.com
        # gave 403 for its ubuntu/26.04 list ("is no longer signed"), so apt update and install-deps failed (exit 100).
        # This step moves each source file that names no Ubuntu archive to a folder of its own. A later step puts them back.
        . /etc/os-release
        if [ "${ID:-}" != ubuntu ] || [ ! -d /etc/apt/sources.list.d ]; then exit 0; fi
        aside=/etc/apt/setup-playwright-aside
        sudo mkdir -p "$aside"
        for file in /etc/apt/sources.list.d/*; do
          [ -f "$file" ] || continue
          if ! grep -q -E "$UBUNTU_SOURCE" "$file"; then
            echo "apt source set aside for the install: $file"
            sudo mv "$file" "$aside/"
          fi
        done
    # The restore and the save are two steps, so that a run with missing system packages saves no cache. A cache with
    # the browsers and no .deb files would stay under its key, and each later run would download the packages again.
    # A stalled download of the cache ends after 3 minutes (the default is 10). Then the step installs the browsers.
    # One run stalled at 41.3 % and held the job until its time limit.
    - id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      env:
        SEGMENT_DOWNLOAD_TIMEOUT_MINS: "3"
      with:
        path: |
          ~/.cache/ms-playwright
          ~/.cache/apt-archives/*.deb
        key: playwright-${{ runner.os }}-${{ steps.version.outputs.image }}-${{ steps.version.outputs.version }}-${{ steps.version.outputs.browsers }}
    - id: install
      name: Install the browsers, then their system packages
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        COMMAND: ${{ inputs.command }}
        BROWSERS: ${{ inputs.browsers }}
        HIT: ${{ steps.cache.outputs.cache-hit }}
        MINUTES: ${{ inputs.timeout-minutes }}
        ATTEMPTS: ${{ inputs.attempts }}
        PACKAGES: ${{ inputs.packages }}
        BEST_EFFORT_MINUTES: ${{ inputs.best-effort-minutes }}
        SCRIPT: ${{ github.action_path }}/install.ts
      run: node "$SCRIPT" install
    - name: Put back the apt sources that were set aside
      if: always() && runner.os == 'Linux'
      shell: bash
      run: |
        aside=/etc/apt/setup-playwright-aside
        if [ ! -d "$aside" ]; then exit 0; fi
        for file in "$aside"/*; do
          if [ -f "$file" ]; then sudo mv "$file" /etc/apt/sources.list.d/; fi
        done
        sudo rmdir "$aside"
    - name: Save the browsers and the system packages in the cache
      if: steps.cache.outputs.cache-hit != 'true' && steps.install.outputs.packages == 'installed'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/ms-playwright
          ~/.cache/apt-archives/*.deb
        key: ${{ steps.cache.outputs.cache-primary-key }}
