name: site-check
description: >-
  Checks a built site in a headless Chromium at phone and desktop widths, in light and dark. A failed check fails the
  step, so a deploy after it does not start. The artifact site-check (the input artifact-name) has the screenshots and the report.
inputs:
  out:
    description: The folder of the built site.
    required: true
  base:
    description: The base path of the site. Empty uses the name of the repository.
    default: ""
  site-check-pages:
    description: The pages to check, from the site home, separated by commas. Empty checks the home only.
    default: ""
  site-check-widths:
    description: The widths of the check in CSS pixels, separated by commas. Empty gives 360,400,1280.
    default: ""
  site-check-probe:
    description: >-
      The probes: JavaScript or TypeScript files of the repository that test the interactive core of a page, separated by
      commas. A file with no page is the probe of the first page. A pair <page>=<file> is the probe of that page, for
      example /structures/=src/structures-probe.ts. A page with no probe has none. The first page takes one probe only.
    default: ""
  site-check-playwright:
    description: The version of playwright-core whose Chromium the check uses.
    default: "1.64.1"
  visual:
    description: "true: the check of the widths and the schemes (site-pages check). false: only the navigation crawl."
    default: "true"
  nav:
    description: >-
      true: also the navigation crawl (site-pages nav). It fails on a page more than 2 clicks from home, a page with no
      way back to home, a link of the site that opens a new tab, a link to a missing page, and a page with no site bar.
    default: "false"
  artifact-name:
    description: >-
      The name of the artifact with the screenshots and the report. Two calls in one run need two names: a download
      by name gets only the latest artifact of the name, and download-artifact also lists by ID only the latest.
    default: site-check
runs:
  using: composite
  steps:
    # The check uses the Chromium of a pinned Playwright, not the Chrome of the runner image, so each run
    # checks with the same browser. playwright-core goes into its own folder, as the tool of site-pages does.
    - name: Playwright for the site check
      shell: bash
      env:
        VERSION: ${{ inputs.site-check-playwright }}
      run: npm install --prefix "$RUNNER_TEMP/site-check-playwright" --no-save --no-package-lock --no-audit --no-fund "playwright-core@$VERSION"
    # A composite action resolves a local path from the workspace, not from its own folder. So this step names a commit.
    - uses: mark1russell7/template/.github/actions/setup-playwright@f039d649b66d2d7cb6746ab5927f77b7001ca40d # main
      with:
        command: ${{ runner.temp }}/site-check-playwright/node_modules/.bin/playwright-core
        browsers: chromium
    # The check starts from the source of the commit of this action (packages/site-pages/src/check imports only
    # Node.js and packages/site-pages/src/data), so it needs no npm release of site-pages.
    - name: Site check
      if: inputs.visual == 'true'
      shell: bash
      env:
        OUT: ${{ inputs.out }}
        BASE: ${{ inputs.base }}
        PAGES: ${{ inputs.site-check-pages }}
        WIDTHS: ${{ inputs.site-check-widths }}
        PROBE: ${{ inputs.site-check-probe }}
      run: |
        args=(--out "$OUT" --repo "$GITHUB_REPOSITORY" --shots "$RUNNER_TEMP/site-check")
        [ -z "$BASE" ] || args+=(--base "$BASE")
        [ -z "$PAGES" ] || args+=(--pages "$PAGES")
        [ -z "$WIDTHS" ] || args+=(--widths "$WIDTHS")
        # Each item of the list is a file (the first page) or a pair <page>=<file>. An item of only spaces adds nothing.
        IFS=',' read -ra items <<< "$PROBE"
        first=""
        for item in "${items[@]}"; do
          item="${item#"${item%%[![:space:]]*}"}"
          item="${item%"${item##*[![:space:]]}"}"
          if [ -z "$item" ]; then continue; fi
          case "$item" in
            *=*) args+=(--page-probe "$item") ;;
            *)
              if [ -n "$first" ]; then echo "::error::site-check-probe has two probes for the first page: $first and $item"; exit 2; fi
              first="$item"
              args+=(--probe "$item") ;;
          esac
        done
        node "$GITHUB_ACTION_PATH/../../../packages/site-pages/src/check/main.ts" "${args[@]}"
    # The crawl of the built site from its home. The pages of the bar must have the bar (--require-bar).
    - name: Site navigation
      if: inputs.nav == 'true'
      shell: bash
      env:
        OUT: ${{ inputs.out }}
        BASE: ${{ inputs.base }}
      run: |
        # The limit of the crawl is the number of built pages, at least 60, so the crawl can open each page and has no no-read
        built=$(find "$OUT" -type f -name '*.html' | wc -l)
        args=(nav --out "$OUT" --repo "$GITHUB_REPOSITORY" --require-bar --max-pages "$(( built > 60 ? built : 60 ))" --shots "$RUNNER_TEMP/site-check/nav")
        [ -z "$BASE" ] || args+=(--base "$BASE")
        node "$GITHUB_ACTION_PATH/../../../packages/site-pages/src/check/main.ts" "${args[@]}"
    # The screenshots, report.json and summary.md, also of a failed check, for a review of the site.
    - name: Screenshots of the site check
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/site-check
        if-no-files-found: warn
        retention-days: 14
