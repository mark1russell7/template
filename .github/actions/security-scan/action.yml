name: security-scan
description: >-
  The security scans of a repository in one job: the dependency review (pull requests only), osv-scanner and CodeQL.
  On a pull request, a scan fails only for a new finding at or above fail-on-severity. On a push, a schedule or a
  manual run, the scans upload their findings to code scanning and do not fail on findings. Each scan runs also when
  an earlier scan failed. The last step fails, and names each scan that failed. The job of the caller gives the
  permissions and the time limit (CI.md, "Security").
inputs:
  fail-on-severity:
    description: The lowest severity of a new finding that fails a pull request. One of low, moderate, high or critical.
    default: high
  dependency-review:
    description: Run the dependency review on pull requests ("true" or "false").
    default: "true"
  dependency-review-scopes:
    description: The scopes of the dependencies that the dependency review examines, separated by commas. The scopes are runtime, development and unknown.
    default: runtime, development, unknown
  osv:
    description: Run osv-scanner ("true" or "false").
    default: "true"
  osv-lockfile:
    description: The lockfiles that osv-scanner scans, separated by spaces. Empty scans each lockfile that osv-scanner finds in the repository.
    default: ""
  codeql:
    description: Run CodeQL ("true" or "false"). Set "false" in a repository that uses the default setup of code scanning, because the two conflict.
    default: "true"
  codeql-languages:
    description: The CodeQL languages, separated by commas. The scan skips a language that has no files in the repository.
    default: javascript-typescript,actions
  codeql-build-mode:
    description: The CodeQL build mode. "none" analyzes the source with no build.
    default: none
runs:
  using: composite
  # No step installs or runs the code of the repository.
  #
  # The id of each step of a scan starts with the name of the scan and "_". The last step reads the ids. Each step
  # of a scan has "!cancelled()" in its condition, so a scan runs also when an earlier scan failed. A step also
  # needs the steps before it in its own scan, so a scan stops at its first failed step, as a job does.
  steps:
    - name: Check out the repository
      id: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        # On a pull request, the checkout is the merge commit. Its first parent is the base.
        fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

    # The dependency review (pull requests only): GitHub compares the dependencies of the base and of the pull
    # request. The scan fails for a new dependency with a known vulnerability. The action reads the dependency
    # graph through the API. It does not read the checkout.
    - name: Dependency review
      id: dependency-review_scan
      if: ${{ !cancelled() && inputs.dependency-review == 'true' && github.event_name == 'pull_request' }}
      uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      with:
        fail-on-severity: ${{ inputs.fail-on-severity }}
        fail-on-scopes: ${{ inputs.dependency-review-scopes }}
        # A comment on the pull request needs pull-requests: write. The summary of the run has the report.
        comment-summary-in-pr: never

    # osv-scanner reads the lockfiles. It does not install or run code. On a pull request, it scans the lockfiles
    # of the base and of the pull request, and fails for a vulnerability that only the pull request has. On the
    # other events, it scans all the lockfiles and uploads the results.
    - name: Arguments of osv-scanner
      id: osv-scanner_args
      if: ${{ !cancelled() && inputs.osv == 'true' && steps.checkout.outcome == 'success' }}
      shell: bash
      env:
        LOCKFILES: ${{ inputs.osv-lockfile }}
      run: |
        if [ -z "$LOCKFILES" ]; then
          args=$'--recursive\n--allow-no-lockfiles\n./'
        else
          args=""
          for file in $LOCKFILES; do
            args+="--lockfile=$file"$'\n'
          done
        fi
        {
          echo "args<<END_OF_ARGS"
          printf '%s\n' "$args"
          echo "END_OF_ARGS"
        } >> "$GITHUB_OUTPUT"

    # A pull request: scan the base, scan the pull request, and compare the two results
    - name: Check out the base
      id: osv-scanner_base-checkout
      if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.osv-scanner_args.outcome == 'success' }}
      shell: bash
      run: git checkout --quiet --detach HEAD^1

    - name: Scan the base
      id: osv-scanner_base
      if: ${{ !cancelled() && steps.osv-scanner_base-checkout.outcome == 'success' }}
      # osv-scanner fails when it finds a vulnerability. The step "Compare" reads the results.
      continue-on-error: true
      uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
      with:
        scan-args: |-
          --format=json
          --output=osv-base.json
          ${{ steps.osv-scanner_args.outputs.args }}

    # This step runs also after a failure of the two steps before it, so the later scans get the pull request.
    - name: Check out the pull request
      id: osv-scanner_head-checkout
      if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.osv-scanner_args.outcome == 'success' }}
      shell: bash
      run: git checkout --quiet --force --detach "$GITHUB_SHA"

    - name: Scan the pull request
      id: osv-scanner_head
      if: ${{ !cancelled() && steps.osv-scanner_base-checkout.outcome == 'success' && steps.osv-scanner_head-checkout.outcome == 'success' }}
      continue-on-error: true
      uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
      with:
        scan-args: |-
          --format=json
          --output=osv-head.json
          ${{ steps.osv-scanner_args.outputs.args }}

    - name: Compare
      id: osv-scanner_compare
      if: ${{ !cancelled() && steps.osv-scanner_head.conclusion == 'success' }}
      shell: bash
      env:
        SEVERITY: ${{ inputs.fail-on-severity }}
        # The CVSS score of fail-on-severity. It is empty for an incorrect value.
        MIN_SCORE: ${{ fromJSON('{"low":0.1,"moderate":4,"high":7,"critical":9}')[inputs.fail-on-severity] }}
      run: |
        node - <<'JS'
        const fs = require("node:fs");
        const min = Number(process.env.MIN_SCORE);
        if (!(min > 0)) {
          console.log(`::error::"${process.env.SEVERITY}" is not a severity. Use low, moderate, high or critical.`);
          process.exit(1);
        }
        const read = (file) => {
          try {
            const text = fs.readFileSync(file, "utf8");
            return text.trim() === "" ? null : JSON.parse(text);
          } catch {
            return null;
          }
        };
        const head = read("osv-head.json");
        if (head === null) {
          console.log('::error::osv-scanner wrote no results for the pull request. The log of the step "Scan the pull request" tells why.');
          process.exit(1);
        }
        let base = read("osv-base.json");
        if (base === null) {
          console.log("::warning::osv-scanner wrote no results for the base. The job compares the pull request with an empty list.");
          base = { results: [] };
        }
        // The GitHub Advisory severity, when the advisory has no CVSS score
        const levels = { CRITICAL: 9, HIGH: 7, MODERATE: 4, MEDIUM: 4, LOW: 0.1 };
        // One entry for each vulnerability (a group of aliases) of each package
        const entries = (report) =>
          (report.results ?? []).flatMap((result) =>
            (result.packages ?? []).flatMap((pkg) =>
              (pkg.groups ?? []).map((group) => {
                const ids = group.aliases ?? group.ids ?? [];
                const vulns = (pkg.vulnerabilities ?? []).filter((vuln) => ids.includes(vuln.id));
                let score = Number.parseFloat(group.max_severity);
                if (Number.isNaN(score)) {
                  const known = vulns
                    .map((vuln) => levels[String(vuln.database_specific?.severity ?? "").toUpperCase()])
                    .filter((value) => value !== undefined);
                  score = known.length > 0 ? Math.max(...known) : Number.NaN;
                }
                return {
                  lockfile: String(result.source?.path ?? "").replace(/^\/github\/workspace\//, ""),
                  ecosystem: pkg.package?.ecosystem ?? "",
                  name: pkg.package?.name ?? "",
                  version: pkg.package?.version ?? "",
                  id: (group.ids ?? ids)[0] ?? "",
                  ids,
                  score,
                  summary: vulns.find((vuln) => vuln.summary)?.summary ?? "",
                };
              }),
            ),
          );
        const key = (entry, id) => `${entry.ecosystem}|${entry.name}|${id}`;
        const old = new Set(entries(base).flatMap((entry) => entry.ids.map((id) => key(entry, id))));
        const added = entries(head).filter((entry) => !entry.ids.some((id) => old.has(key(entry, id))));
        const property = (text) => String(text).replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A").replace(/:/g, "%3A").replace(/,/g, "%2C");
        const data = (text) => String(text).replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
        const rows = [];
        let failed = 0;
        for (const entry of added) {
          const fails = entry.score >= min;
          const score = Number.isNaN(entry.score) ? "unknown" : entry.score.toFixed(1);
          const level = fails ? "error" : "warning";
          const limit = fails ? "" : ", below the limit";
          const title = `osv-scanner: ${entry.id} (severity ${score}${limit})`;
          console.log(`::${level} file=${property(entry.lockfile)},title=${property(title)}::${data(`${entry.name} ${entry.version} (${entry.ecosystem}): ${entry.summary}`)}`);
          rows.push(`| ${entry.id} | ${entry.name} ${entry.version} | ${score} | \`${entry.lockfile}\` | ${fails ? "fails" : "below the limit"} |`);
          if (fails) failed += 1;
        }
        const summary = [`### osv-scanner: new vulnerabilities of this pull request`, ""];
        if (rows.length === 0) {
          summary.push("The pull request adds no vulnerability.");
        } else {
          summary.push("| Vulnerability | Package | CVSS | Lockfile | Result |", "|---|---|---|---|---|", ...rows);
        }
        fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join("\n") + "\n");
        if (failed > 0) {
          console.log(`::error::The pull request adds ${failed} vulnerabilities at or above ${process.env.SEVERITY}.`);
          process.exit(1);
        }
        JS

    # A push, a schedule or a manual run: scan everything and upload the results
    - name: Scan
      id: osv-scanner_scan
      if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.osv-scanner_args.outcome == 'success' }}
      # osv-scanner fails when it finds a vulnerability. These findings go to the Security tab.
      continue-on-error: true
      uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
      with:
        scan-args: |-
          --format=sarif
          --output=osv.sarif
          ${{ steps.osv-scanner_args.outputs.args }}

    - name: Check the scan
      id: osv-scanner_check
      if: ${{ !cancelled() && steps.osv-scanner_scan.conclusion == 'success' }}
      shell: bash
      run: |
        if [ ! -s osv.sarif ]; then
          echo "::error::osv-scanner wrote no results. The log of the step \"Scan\" tells why."
          exit 1
        fi
        count=$(node -e 'const s = JSON.parse(require("node:fs").readFileSync("osv.sarif", "utf8")); console.log((s.runs ?? []).reduce((n, run) => n + (run.results ?? []).length, 0));')
        echo "osv-scanner found $count vulnerable packages. The Security tab shows them." >> "$GITHUB_STEP_SUMMARY"

    - name: Upload the results to code scanning
      id: osv-scanner_upload
      if: ${{ !cancelled() && steps.osv-scanner_check.outcome == 'success' }}
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: osv.sarif
        category: osv-scanner

    # CodeQL analyzes the source of the checkout, so the results of osv-scanner go out of it
    - name: Move the results of osv-scanner
      id: osv-scanner_move
      if: ${{ !cancelled() && steps.osv-scanner_args.outcome == 'success' }}
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/osv-scanner"
        for file in osv-base.json osv-head.json osv.sarif; do
          if [ -e "$file" ]; then mv -f "$file" "$RUNNER_TEMP/osv-scanner/"; fi
        done

    # CodeQL analyzes the source with no build (build-mode none). It runs no code of the repository. On a pull
    # request, the scan fails for an alert on a line that the pull request adds or changes. On the other events,
    # it uploads the results.
    #
    # CodeQL fails for a language with no source files, so the scan skips such a language
    - name: Languages
      id: codeql_languages
      if: ${{ !cancelled() && inputs.codeql == 'true' && steps.checkout.outcome == 'success' }}
      shell: bash
      env:
        LANGUAGES: ${{ inputs.codeql-languages }}
      run: |
        # CodeQL analyzes the commit of the run. A failed step of osv-scanner can leave the base in the checkout.
        if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
          echo "::error::The checkout is $(git rev-parse HEAD), not the commit of the run $GITHUB_SHA."
          exit 1
        fi
        declare -A patterns=(
          [javascript-typescript]='\.(js|jsx|mjs|cjs|ts|tsx|mts|cts|vue)$'
          [javascript]='\.(js|jsx|mjs|cjs|ts|tsx|mts|cts|vue)$'
          [typescript]='\.(js|jsx|mjs|cjs|ts|tsx|mts|cts|vue)$'
          [actions]='(^|/)action\.ya?ml$|^\.github/workflows/[^/]+\.ya?ml$'
          [python]='\.py$'
          [go]='\.go$'
          [ruby]='\.rb$'
          [java-kotlin]='\.(java|kt|kts)$'
          [csharp]='\.(cs|cshtml|razor)$'
          [c-cpp]='\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$'
          [rust]='\.rs$'
          [swift]='\.swift$'
        )
        files=$(git ls-files)
        keep=()
        for language in ${LANGUAGES//,/ }; do
          pattern=${patterns[$language]:-}
          # CodeQL itself checks a language that this list does not know
          if [ -z "$pattern" ] || grep -qE "$pattern" <<< "$files"; then
            keep+=("$language")
          else
            echo "::notice title=CodeQL::The repository has no files of the language $language. The scan skips it."
          fi
        done
        joined=$(IFS=,; echo "${keep[*]}")
        echo "CodeQL languages: ${joined:-none}" >> "$GITHUB_STEP_SUMMARY"
        echo "languages=$joined" >> "$GITHUB_OUTPUT"
        # The category of the job codeql of reusable-security.yml ("<workflow file>:codeql"), so the alerts of the
        # Security tab stay with the same analysis
        workflow=${GITHUB_WORKFLOW_REF#"$GITHUB_REPOSITORY/"}
        echo "category=${workflow%%@*}:codeql" >> "$GITHUB_OUTPUT"

    # The first init downloads the CodeQL bundle of the action's version. On 2026-11-08 GitHub gave HTTP 504 on that
    # download again and again, but not on each try. Thus a failure of the first init is not a failure of the
    # scan: its conclusion is "success" (continue-on-error). After a wait of 60 seconds, a second init downloads the
    # same bundle again, and it decides. If the second init also fails, the scan fails, as before.
    # There is no fallback with no download: codeql-action ignores "tools: toolcache" in a workflow of a push or a
    # pull request ("not triggered dynamically"), and the first init can remove the older bundle of the runner image.
    # The step summary tells which start passed.
    - name: Initialize CodeQL
      id: codeql_init
      if: ${{ !cancelled() && steps.codeql_languages.outcome == 'success' && steps.codeql_languages.outputs.languages != '' }}
      continue-on-error: true
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        languages: ${{ steps.codeql_languages.outputs.languages }}
        build-mode: ${{ inputs.codeql-build-mode }}

    - name: Wait before the second CodeQL start
      if: ${{ !cancelled() && steps.codeql_init.outcome == 'failure' }}
      shell: bash
      run: sleep 60

    - name: Initialize CodeQL, second start
      id: codeql_init-retry
      if: ${{ !cancelled() && steps.codeql_init.outcome == 'failure' }}
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        languages: ${{ steps.codeql_languages.outputs.languages }}
        build-mode: ${{ inputs.codeql-build-mode }}

    - name: Name the CodeQL bundle
      if: ${{ !cancelled() && (steps.codeql_init.outcome == 'success' || steps.codeql_init-retry.outcome == 'success') }}
      shell: bash
      env:
        SOURCE: ${{ steps.codeql_init.outcome == 'success' && 'the first start' || 'the second start (the first download failed)' }}
        VERSION: ${{ steps.codeql_init.outcome == 'success' && steps.codeql_init.outputs.codeql-version || steps.codeql_init-retry.outputs.codeql-version }}
      run: |
        echo "CodeQL bundle: ${VERSION:-unknown}, from $SOURCE" >> "$GITHUB_STEP_SUMMARY"

    - name: Analyze
      id: codeql_analyze
      if: ${{ !cancelled() && (steps.codeql_init.outcome == 'success' || steps.codeql_init-retry.outcome == 'success') }}
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        # A pull request uploads nothing. The step "Fail on new alerts" examines its results.
        upload: ${{ github.event_name == 'pull_request' && 'never' || 'always' }}
        output: ${{ runner.temp }}/codeql-results
        category: ${{ steps.codeql_languages.outputs.category }}

    - name: Fail on new alerts
      id: codeql_new-alerts
      if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.codeql_analyze.outcome == 'success' }}
      shell: bash
      env:
        SEVERITY: ${{ inputs.fail-on-severity }}
        RESULTS: ${{ runner.temp }}/codeql-results
        DIFF: ${{ runner.temp }}/pull-request.diff
        # The step reads the open alerts of the base branch: an alert that is already open there is not new (new-alerts.ts)
        GH_TOKEN: ${{ github.token }}
        BASE_REF: ${{ github.base_ref }}
        NEW_ALERTS: ${{ github.action_path }}/new-alerts.ts
      run: |
        # The changes of the pull request: the merge commit compared with its first parent, the base
        git -c core.quotePath=false diff --unified=0 --no-color --no-ext-diff --src-prefix=a/ --dst-prefix=b/ HEAD^1 HEAD > "$DIFF"
        node "$NEW_ALERTS"

    # The verdict: each scan that the inputs and the event start must pass (verdict.ts)
    - name: Each scan passed
      if: ${{ !cancelled() }}
      shell: bash
      env:
        # Only the outcome and the conclusion of each step. toJSON(steps) also has the outputs of the steps, and a large
        # output (the dependency changes of a big lock change) makes the environment too large for the start of bash.
        STEPS: |
          {
          "checkout": { "outcome": "${{ steps.checkout.outcome }}", "conclusion": "${{ steps.checkout.conclusion }}" },
          "dependency-review_scan": { "outcome": "${{ steps.dependency-review_scan.outcome }}", "conclusion": "${{ steps.dependency-review_scan.conclusion }}" },
          "osv-scanner_args": { "outcome": "${{ steps.osv-scanner_args.outcome }}", "conclusion": "${{ steps.osv-scanner_args.conclusion }}" },
          "osv-scanner_base-checkout": { "outcome": "${{ steps.osv-scanner_base-checkout.outcome }}", "conclusion": "${{ steps.osv-scanner_base-checkout.conclusion }}" },
          "osv-scanner_base": { "outcome": "${{ steps.osv-scanner_base.outcome }}", "conclusion": "${{ steps.osv-scanner_base.conclusion }}" },
          "osv-scanner_head-checkout": { "outcome": "${{ steps.osv-scanner_head-checkout.outcome }}", "conclusion": "${{ steps.osv-scanner_head-checkout.conclusion }}" },
          "osv-scanner_head": { "outcome": "${{ steps.osv-scanner_head.outcome }}", "conclusion": "${{ steps.osv-scanner_head.conclusion }}" },
          "osv-scanner_compare": { "outcome": "${{ steps.osv-scanner_compare.outcome }}", "conclusion": "${{ steps.osv-scanner_compare.conclusion }}" },
          "osv-scanner_scan": { "outcome": "${{ steps.osv-scanner_scan.outcome }}", "conclusion": "${{ steps.osv-scanner_scan.conclusion }}" },
          "osv-scanner_check": { "outcome": "${{ steps.osv-scanner_check.outcome }}", "conclusion": "${{ steps.osv-scanner_check.conclusion }}" },
          "osv-scanner_upload": { "outcome": "${{ steps.osv-scanner_upload.outcome }}", "conclusion": "${{ steps.osv-scanner_upload.conclusion }}" },
          "osv-scanner_move": { "outcome": "${{ steps.osv-scanner_move.outcome }}", "conclusion": "${{ steps.osv-scanner_move.conclusion }}" },
          "codeql_languages": { "outcome": "${{ steps.codeql_languages.outcome }}", "conclusion": "${{ steps.codeql_languages.conclusion }}" },
          "codeql_init": { "outcome": "${{ steps.codeql_init.outcome }}", "conclusion": "${{ steps.codeql_init.conclusion }}" },
          "codeql_init-retry": { "outcome": "${{ steps.codeql_init-retry.outcome }}", "conclusion": "${{ steps.codeql_init-retry.conclusion }}" },
          "codeql_analyze": { "outcome": "${{ steps.codeql_analyze.outcome }}", "conclusion": "${{ steps.codeql_analyze.conclusion }}" },
          "codeql_new-alerts": { "outcome": "${{ steps.codeql_new-alerts.outcome }}", "conclusion": "${{ steps.codeql_new-alerts.conclusion }}" }
          }
        DEPENDENCY_REVIEW: ${{ inputs.dependency-review == 'true' && github.event_name == 'pull_request' }}
        OSV_SCANNER: ${{ inputs.osv == 'true' }}
        CODEQL: ${{ inputs.codeql == 'true' }}
        VERDICT: ${{ github.action_path }}/verdict.ts
      # Node 22.18 and later run TypeScript with no build. The ubuntu-latest image has such a Node.
      run: node "$VERDICT"
