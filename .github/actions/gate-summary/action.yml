name: gate-summary
description: >-
  The step of the summary job "<Name> OK" of a gate workflow. The ruleset requires that check, so it must pass only
  when the gate passed: each job succeeded, or the job "changes" found no file of the gate and the gate jobs were
  skipped. A failure, a cancel or a skip for another reason fails it. The job has "if: always()" and "needs" with
  each job of the workflow.
inputs:
  needs:
    description: The jobs of the workflow, as "toJSON(needs)".
    required: true
  changes:
    description: The id of the job that runs the action "changes". With no such job in "needs", each job must succeed.
    default: changes
  allow-skip:
    description: The ids of jobs that may be skipped even when the gate runs, separated by spaces (for example a job of one event only).
    default: ""
runs:
  using: composite
  steps:
    - name: Each job of the gate passed
      shell: bash
      env:
        NEEDS: ${{ inputs.needs }}
        CHANGES: ${{ inputs.changes }}
        ALLOW_SKIP: ${{ inputs.allow-skip }}
      run: |
        printf '%s' "$NEEDS" | jq -r --arg changes "$CHANGES" --arg allow "$ALLOW_SKIP" -f "$GITHUB_ACTION_PATH/summary.jq" > verdict
        cat verdict
        {
          echo "### $GITHUB_WORKFLOW"
          echo
          echo '```'
          cat verdict
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        if grep -q '^FAIL' verdict; then
          grep '^FAIL' verdict | sed 's/^FAIL /::error::/'
          exit 1
        fi
