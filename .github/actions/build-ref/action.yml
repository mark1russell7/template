name: build-ref
description: >-
  Gives the commit that the job build of reusable-pages.yml checks out. It fails closed, and it never gives the commit
  of a fork. ref.ts tells the rules.
inputs:
  green:
    description: The commit of the step green-main, or empty when that step did not start.
    default: ""
outputs:
  sha:
    description: The commit hash.
    value: ${{ steps.ref.outputs.sha }}
runs:
  using: composite
  steps:
    - id: ref
      name: The commit to build
      shell: bash
      env:
        GREEN: ${{ inputs.green }}
        REF: ${{ github.action_path }}/ref.ts
      # The script reads the event file itself, so no field of the event goes through an expression.
      # Node 22.18 and later run TypeScript with no build. The ubuntu-latest image has such a Node.
      run: node "$REF"
