<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{scope}}</title>
<meta name="description" content="{{description}}">
<!-- The icon of the site. Without an icon link, the browser asks for /favicon.ico and logs a 404 error. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%232346c4%22%2F%3E%3Cpath%20d%3D%22M10%207h8l5%205v13H10z%22%20fill%3D%22%23fff%22%2F%3E%3Cpath%20d%3D%22M18%207v5h5z%22%20fill%3D%22%23e7ecfd%22%2F%3E%3C%2Fsvg%3E">
<script>
  // The theme before the first paint: the choice of the visitor, else the theme of the system.
  try { const t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
</script>
<link rel="stylesheet" href="./src/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="./">{{scope}}</a>
  <nav aria-label="Site">
    <a href="./releases/">Releases</a>
    <a href="./status/">Status</a>
    <a href="https://github.com/mark1russell7/{{scope}}">GitHub</a>
    <button id="theme" class="theme" type="button" aria-label="Change the theme"><span aria-hidden="true">◐</span></button>
  </nav>
</header>

<main>
  <h1>{{scope}}</h1>
  <p class="lead">{{description}}</p>

  <h2>{{installTitle}}</h2>
  <div class="command">
    <code id="install">{{install}}</code>
    <button id="copy" type="button">Copy</button>
  </div>
  <p class="note">{{note}}<a href="./releases/">Releases</a> shows each version, and <a href="./status/">Status</a> shows the open work.</p>
</main>

<script type="module" src="./src/index.ts"></script>
</body>
</html>
