packages:
  - "packages/*"

# Packages allowed to run install scripts. Since pnpm 11 every other package that has one fails the install.
# A git-hosted package is approved by its repository URL, so a new commit of cue needs no new approval.
allowBuilds:
  "@mark1russell7/cue@git+https://github.com/mark1russell7/cue.git": true
  esbuild: true
  # Its install script only checks the native package, which pnpm installs as an optional dependency.
  "@swc/core": false

# Our own packages: the release train updates them, so the release age check of pnpm does not apply to them.
minimumReleaseAgeExclude:
  - "@mark1russell7/*"
  - "@procedures/*"

# An install fails when a version has less trust evidence than an earlier version of the same package: for example,
# a version with no provenance after versions from a trusted publisher. Such a version can be a stolen token.
# Our own packages pass, because release.yml publishes them with OIDC and provenance.
trustPolicy: no-downgrade
# The first versions of these 3 packages were staged by hand, with an approver. pnpm ranks a staged publish above a
# trusted publisher, so it refuses each later version from release.yml (pnpm/pnpm#16689). The bootstrap of today
# publishes a prerelease, which pnpm does not compare, so no other package needs this.
trustPolicyExclude:
  - "@mark1russell7/cue"
  - "@mark1russell7/docker-sqlite"
  - "@mark1russell7/splay"
